# kdf-fmt configuration — the KDF Python house style (spec: kriegerdataforge-fmt
# docs/reference/KDF_FMT_SPEC.md; tool at main, ci.yml `kdf_fmt_ref`, refreshed by the Makefile, D-054).
# Adoption is BASELINE-gated (kdf-style-debt.json): pre-existing findings are
# recorded debt, only NEW violations fail. Burn down with `kdf-fmt format` per area,
# then `kdf-fmt check --update-baseline`.

line_length      = 120
max_module_lines = 1000

quiet_degenerate_sections = true

# this repo's Python is scripts/, its src tree, and the repo map's module beside the machine's tools (D-082), all strict
roots = ["scripts", "tools/claude-code"]

# backup snapshots are frozen artifacts, not living code, and the scan's KDF rules sit beside their test cases, written
# in Opengrep's test form to be flagged (D-085)
exclude = ["scripts/backups/", "scripts/common/scan_rules/"]

[rules]
# no decorative banners / __all__ policy enforced while the baseline burns down
"KDF-105"  = "off"
"KDF-106a" = "off"
"KDF-604"  = "off"

[rules.overrides]
# pytest tests are self-documenting; the operational scripts keep every rule strict
"scripts/tests/**" = { "KDF-104" = "off", "KDF-403" = "off", "KDF-404" = "off", "KDF-405" = "off", "KDF-406" = "off", "KDF-602" = "off" }
# the mutation engine is one file, so a repo vendors it whole and its worktree rules read in one place (D-040)
"scripts/common/mutation_runner.py" = { "KDF-605" = "off" }
# the repo map is one file the wrapper runs isolated, which keeps its own folder off the import path, so a second module
# would be loaded by its path, and it stays whole past the advisory line count, the owner's word (D-082)
"tools/claude-code/kdf_repo_map.py" = { "KDF-605" = "off" }
