name: "Ops · Distribute App secrets"
description: "Owner-only: copy the read only GitHub App's credentials to the consumer repos in the registry."
title: "[Ops] Distribute App secrets: "
labels:
  - ops
assignees:
  - Needless2Say

body:
  - type: markdown
    attributes:
      value: |
        ## Distribute the read only App's credentials to the consumer repos
        Copies the read only App's pair, `KDF_READER_APP_ID` + `KDF_READER_APP_PRIVATE_KEY` in cicd's
        **`ops`** environment, to the repository secrets `KDF_APP_ID` + `KDF_APP_PRIVATE_KEY` of the target
        repos listed in `scripts/secret_registry.json` (the entries carrying `distribute_source_env`),
        cicd's own last, both values to a repo before the next. The copies power the lanes' read token
        mints, the E2E gate's and the `ci-python-*` private-package installs. Owner-only — the backing
        workflow fails closed otherwise, and every run waits for the owner's approval of `ops`.

        **When to run**
        - After a new App **private key** (`SECRET_ROTATION.md` §8.3a) — the consumer copies are
          stale until re-distributed.
        - After **adding a consumer repo** to the registry's target list, selecting that repo alone.
        - `check` any time: a read-only audit of which repos hold / lack the copies (names +
          timestamps only — the API cannot return values).
        - `bootstrap` once, in the secrets fence's sitting, while cicd's repository pair is still the old
          writer. It fails closed after.

        > **Pre-org-move stopgap.** After an org move these become org secrets (visible to all
        > repos, no copies) — this flow is then obsolete and the registry's target list is the
        > cleanup checklist. Writes are idempotent; re-running converges.

  - type: dropdown
    id: mode
    attributes:
      label: Mode
      description: "check = read-only audit; execute = write the copies; bootstrap = the sitting's one write with the old writer."
      options:
        - check
        - execute
        - bootstrap
    validations:
      required: true

  - type: textarea
    id: repositories
    attributes:
      label: Repositories
      description: "ALL, or the target repos to write, one per line or comma separated, each checked against the registry."
      value: "ALL"
    validations:
      required: true

  - type: dropdown
    id: confirm
    attributes:
      label: Confirm
      description: "execute and bootstrap write the App secrets to the selected registry targets (ignored for check)."
      options:
        - "No — do not run"
        - "Yes — write the App secrets to the selected registry targets"
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ---
        ▶ **To run:** add the **`ops:distribute-app-secrets`** label to this issue, then approve `ops`.
        Re-add the label to re-run (e.g. `check` → fix → `execute` → `check` on this same issue).
        The result is commented here; secret **values** never appear anywhere.
