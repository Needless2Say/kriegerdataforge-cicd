name: "Ops · Rotate a secret"
description: "Owner-only: rotate CI-plane secrets (GitHub Actions secrets / non-Terraform Vercel vars) across the ecosystem."
title: "[Ops] Rotate secret: "
labels:
  - ops
assignees:
  - Needless2Say

body:
  - type: markdown
    attributes:
      value: |
        ## Rotate a CI-plane secret
        Fill in the fields, submit, then **add the `ops:rotate-secrets` label** to run.
        Only the repository owner can run it (the workflow fails closed otherwise). The full
        output stays in the (secret-masked) Actions run; this issue gets a metadata-only summary.

        **Modes**
        - **check** — report time-to-expiry for tracked secrets (e.g. `GH_PACKAGES_PAT`). Reads nothing live.
        - **generate** — auto-mint fresh value(s) and write them everywhere. `VERCEL_DEPLOYMENT_TOKEN`
          mints ONE shared Vercel token written (as a **repository** secret) to every app repo **and**
          the terraform repo (deploy + manage).
        - **paste** — distribute an **owner-supplied** value. **First** stage the value as
          **`SECRET_VALUE_NEW`** in cicd's **`ops`** environment, from a prompt and never the command line
          (`gh secret set SECRET_VALUE_NEW --env ops --repo Needless2Say/kriegerdataforge-cicd`), then select
          one secret + `paste`. **Never type a secret value into this issue** — this repo is public.
          A secret that lives in cicd's `dev` and `prod` (the hub prune and reports cron copies) is written
          to the **one environment** picked below, so a copy for each environment is pasted once for each.
          Every run waits for the owner's approval of `ops`.

        > **These two tokens are the ONLY secrets rotated here — repository-level, one value each.**
        > `GH_PACKAGES_PAT` and `VERCEL_DEPLOYMENT_TOKEN` are each a single global token, stored as
        > **repository** secrets (no environment). Rotation also deletes any leftover per-environment
        > copies (they would shadow the repo value), so there is no environment to pick.

        > **Every OTHER secret stays at the environment level and is NOT rotated here.** The per-env
        > app secrets owned by Terraform (DB URLs, the RS256 keypair, `KDF_SERVICE_KEY`, `STRIPE_*`,
        > OIDC client secrets, `CRON_SECRET`, `VERCEL_PROJECT_ID`, `VERCEL_ORG_ID`, …) remain
        > environment secrets and are rotated via the terraform `SECRETS_ROTATION` runbook — the engine
        > refuses Terraform-managed entries.

        > **Monthly cadence.** `VERCEL_DEPLOYMENT_TOKEN` auto-rotates on a schedule
        > (`rotate-vercel-tokens.yml`, 45-day token) — you can also re-mint it here with `generate`.
        > `GH_PACKAGES_PAT` is **paste-only** (GitHub has no PAT-mint API): create a new fine-grained
        > PAT, stage it in `SECRET_VALUE_NEW`, then run `paste`. The weekly monitor warns before either
        > lapses; run `check` any time to see days-to-expiry.

  - type: dropdown
    id: secrets
    attributes:
      label: Secret(s)
      description: "Which secret(s) to act on. Multi-select for generate/check. Paste = pick exactly one."
      multiple: true
      options:
        - ALL
        - GH_PACKAGES_PAT
        - VERCEL_DEPLOYMENT_TOKEN
        - GH_NPM_TOKEN
        - REPORTS_CRON_SECRET_FITNESS_APP
        - REPORTS_CRON_SECRET_TIFFANYS_SPACE
        - KDF_HUB_URL_DEV
        - KDF_HUB_URL_PROD
        - KDF_HUB_CRON_SECRET_DEV
        - KDF_HUB_CRON_SECRET_PROD
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: Environment
      description: "For a paste of a secret that lives in cicd's dev and prod, the one environment it is written to. None for a repository secret."
      options:
        - none
        - dev
        - prod
    validations:
      required: true

  - type: dropdown
    id: mode
    attributes:
      label: Mode
      description: "check = report only · generate = auto-mint new value(s) · paste = distribute a staged value"
      options:
        - check
        - generate
        - paste
    validations:
      required: true

  - type: dropdown
    id: confirm
    attributes:
      label: Confirm
      description: "generate/paste write LIVE credentials. This must be 'Yes' for those modes."
      options:
        - "No — do not run"
        - "Yes — write live credentials"
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ---
        ▶ **To run:** add the **`ops:rotate-secrets`** label to this issue. Re-add it to re-run.
        For **paste**, stage `SECRET_VALUE_NEW` in the `ops` environment first; delete it afterward.
