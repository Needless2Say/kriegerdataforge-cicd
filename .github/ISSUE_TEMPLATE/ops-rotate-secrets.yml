name: "Ops · Check secret expiry"
description: "Owner-only: report time-to-expiry for the CI-plane secrets the registry tracks."
title: "[Ops] Check secret expiry: "
labels:
  - ops
assignees:
  - Needless2Say

body:
  - type: markdown
    attributes:
      value: |
        ## Check the CI-plane secrets' expiry
        Fill in the field, submit, then **add the `ops:rotate-secrets` label** to run. Only the repository owner can
        run it (the workflow fails closed otherwise). It reads the registry and the recorded expiry facts, nothing
        secret, and this issue gets a metadata-only summary.

        **Rotating is done elsewhere (D-099).**
        - A value a person makes, a PAT or a copy of a value another system owns, is staged in its **own slot** in
          cicd's **`ops`** environment from a prompt, never the command line
          (`gh secret set <SLOT> --env ops --repo Needless2Say/kriegerdataforge-cicd`), then
          **Actions → Ops · Distribute staged secrets → Run workflow** names the slots and you approve `ops`. The
          slots are listed in `scripts/secret_registry.json`, each entry's `staging`.
        - `VERCEL_DEPLOYMENT_TOKEN` is minted by **Rotate Vercel Deployment Token**, on the 1st of each month or by
          a dispatch, a 33-day token.
        - The secrets Terraform owns are rotated through the terraform `SECRETS_ROTATION` runbook.

  - type: dropdown
    id: secrets
    attributes:
      label: Secret(s)
      description: "Which secret(s) to check."
      multiple: true
      options:
        - ALL
        - GH_PACKAGES_PAT
        - GH_NPM_TOKEN
        - VERCEL_DEPLOYMENT_TOKEN
        - CICD_PAT
        - VERCEL_MASTER_TOKEN
        - KDF_APP_PRIVATE_KEY
    validations:
      required: true

  - type: dropdown
    id: mode
    attributes:
      label: Mode
      description: "check = report time-to-expiry, the one mode this form runs"
      options:
        - check
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ---
        ▶ **To run:** add the **`ops:rotate-secrets`** label to this issue. Re-add it to re-run.
