name: "kriegerdataforge-cicd - CodeQL Config"

# Both languages read these paths, codeql.yml running one leg each (D-085, design 5.8). Python
# holds the security-relevant platform code: secret rotation, deployer authorization, project
# provisioning, app-secret distribution. JavaScript holds the Claude Code tools under tools/,
# the PreToolUse guard among them, which a scan of e2e/ alone never read (2026-08-09 found the
# TS leg saw 2 files there, the journey specs living in the app repos, ADR D-006).
paths:
  - scripts
  - e2e
  - tools

paths-ignore:
  - node_modules
  - e2e/node_modules
  # Transient: ci_stack.py copies specs in from sibling repos and removes them again.
  - e2e/staged-tests
  - e2e/test-results
  - e2e/playwright-report
  - scripts/tests
  - "**/__pycache__"
