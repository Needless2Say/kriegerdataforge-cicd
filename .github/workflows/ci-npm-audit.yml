name: Node.js · npm audit

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to check out (tag, branch or SHA). Empty checks out the caller run's own ref, a release dispatch passes the release tag so this lane judges the exact commit being deployed.
        type: string
        default: ""
      node_version:
        description: Node.js version to use
        type: string
        default: "24"
      skip:
        description: Skip every job of this lane, each reporting skipped, which a required check counts as passing. A caller passes its docs only answer, true only after its secret scan succeeded and said every changed path is docs (D-075). False runs every job as before
        type: boolean
        default: false

jobs:
  npm-audit:
    name: npm audit
    # D-075. Only skip, the caller's docs only answer, skips this job. With no always() a cancelled run cancels it,
    #   and a caller on !cancelled() is never entered after a cancel during the scan, its check left unreported
    if: ${{ !inputs.skip }}
    runs-on: ubuntu-slim

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: ${{ inputs.node_version }}
          cache: "npm"

      - name: Install dependencies
        env:
          # Private GH-Packages npm auth (reports-ecosystem epic W3.5): consumers that
          # depend on @needless2say/* commit an .npmrc interpolating ${GH_NPM_TOKEN} — a
          # CLASSIC read:packages PAT (GH Packages rejects fine-grained PATs and App
          # installation tokens). Always exported; empty for token-less consumers.
          GH_NPM_TOKEN: ${{ secrets.GH_NPM_TOKEN }}
        run: npm ci

      - name: Audit for high/critical CVEs
        # Fails only on high or critical vulnerabilities in production
        # dependencies. Dev-only packages are excluded via --omit=dev.
        run: make ci-npm-audit
