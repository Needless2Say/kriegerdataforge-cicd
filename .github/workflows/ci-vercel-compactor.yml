name: Vercel compactor up-to-date

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to check out (tag, branch or SHA). Empty checks out the caller run's own ref, a release dispatch passes the release tag so this lane judges the exact commit being deployed.
        type: string
        default: ""
      python_version:
        description: Python version to use
        type: string
        default: "3.14"
      skip:
        description: Skip every job of this lane, each reporting skipped, which a required check counts as passing. A caller passes its docs only answer, true only after its secret scan succeeded and said every changed path is docs (D-075). False runs every job, a cancelled run ending them failed
        type: boolean
        default: false

jobs:
  vercel-compactor-staleness:
    name: Vercel compactor up-to-date
    # D-075. FAIL CLOSED. A skipped required job counts as passing, so this job runs whatever happened before it, a
    #   cancelled run included, and its first step ends it failed when the run was cancelled. Only skip, the caller's
    #   docs only answer, skips it whole. GitHub reads cancelled() only in an if, so the step's if is the check
    if: ${{ always() && !inputs.skip }}
    runs-on: ubuntu-slim

    steps:
      - name: Fail a cancelled run
        if: ${{ cancelled() }}
        run: |
          echo "::error::the run was cancelled, so this job ends failed rather than skipped and checks nothing"
          exit 1

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ inputs.python_version }}

      - name: Check vercel_api/ is in sync with api/
        # Dry run that exits 1 if regenerating vercel_api/ from api/ would change
        # any file. Prevents deploying a stale Vercel artifact when api/ changes
        # without running `make vercel-compact`. --skip-import-check avoids needing
        # the private SDK installed.
        run: python scripts/vercel_compactor.py --check --skip-import-check
