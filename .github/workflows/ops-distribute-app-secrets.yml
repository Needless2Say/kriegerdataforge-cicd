name: Ops · Distribute App secrets (issue-triggered)

# Issue-form front-end for scripts/distribute_app_secrets.py (reports-ecosystem epic W2.5,
# ADR D-010). Copies the read only GitHub App's credentials, KDF_READER_APP_ID and
# KDF_READER_APP_PRIVATE_KEY in cicd's ops environment, to the repository secrets KDF_APP_ID /
# KDF_APP_PRIVATE_KEY of the consumer repos listed in scripts/secret_registry.json (entries carrying
# `distribute_source_env`), cicd's own last, both values per repo before the next. The issue may
# select repos, each checked against the registry, and the mint is scoped to the same selection.
# Onboarding a consumer is a registry edit, not a workflow edit (AGENTS.md rule 12).
# ops-setup-e2e.yml still owns the E2E-specific variables (RUN_E2E_GATE / USE_GITHUB_APP).
#
# Modes. check audits, execute writes with a token from the writing App in ops, and bootstrap writes
# with a token from cicd's repository pair, KDF_APP_ID / KDF_APP_PRIVATE_KEY, for the secrets fence's
# sitting alone, while that pair is still the old writer. Once the sitting has written the read only
# App's pair there, that App cannot write a secret, so a bootstrap fails closed at its mint.
#
# Triggered ONLY when the `ops:distribute-app-secrets` label is added — a deliberate,
# owner-applied "go". Owner-gated via the reusable fail-closed gate; this repo is public, so
# authorization — not obscurity — is the control (ADR D-002 pattern).
#
# PRE-ORG-MOVE STOPGAP: after an org move KDF_APP_* become ORG secrets (visible to every repo
# with no copy) — this flow and the per-repo copies are then obsolete; the registry's target
# list is the cleanup checklist.
#
# SECURITY:
#   * The write set is the REGISTRY's target list — the engine writes nowhere else, and the
#     App token minted here is scoped to exactly those repositories (secrets:write only).
#   * Secret VALUES never touch the issue or a comment: the engine prints only names, repos,
#     and timestamps (unit-tested invariant), so tee-ing its output into the comment is safe.
#     Values flow env -> libsodium sealed box; GitHub masks them in the (public) Actions log.
#   * The untrusted issue body is read as awk DATA via an env var, never inlined into a shell
#     string; mode/confirm are allow-listed.
#   * check mode is read-only (secret NAMES + timestamps — the API cannot return values).
#
# PREREQUISITE: the writing App holds repository **Secrets: write** and is installed on the target
# repos. Fallback: CICD_PAT, in ops too. Every run waits for the owner's approval of ops.

on:
  issues:
    types:
      - labeled

permissions:
  contents: read

jobs:
  authorize:
    if: github.event.action == 'labeled' && github.event.label.name == 'ops:distribute-app-secrets'
    uses: ./.github/workflows/_authorize-owner.yml

  run:
    name: Distribute App secrets
    needs: authorize
    if: >-
      github.event.action == 'labeled' &&
      github.event.label.name == 'ops:distribute-app-secrets' &&
      needs.authorize.outputs.authorized == 'true' &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner
    runs-on: ubuntu-slim
    # the reader's pair to distribute, the writing App's pair and CICD_PAT live in ops alone, held to main and waiting
    # for the owner's approval
    environment: ops
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Extract and validate fields
        id: fields
        env:
          # Untrusted issue-form body — read only as awk DATA, never inlined into a command.
          BODY: ${{ github.event.issue.body }}
        run: |
          field() {
            awk -v lbl="### $1" '
              { sub(/\r$/, "") }
              $0 == lbl { cap = 1; next }
              /^### / { cap = 0 }
              cap && NF { print }
            ' <<< "$BODY"
          }
          MODE="$(field "Mode" | head -1)"
          CONFIRM="$(field "Confirm" | head -1)"
          REPOS="$(field "Repositories" | tr '\n' ',' | tr -d '\r')"

          case "$MODE" in
            check|execute|bootstrap) ;;
            *) echo "::error::invalid or missing mode: '${MODE}'"; exit 1 ;;
          esac

          if [ "$MODE" != "check" ]; then
            case "$CONFIRM" in
              "Yes"*) ;;
              *) echo "::error::mode=${MODE} writes the App secrets to the selected registry targets — set Confirm = 'Yes'."; exit 1 ;;
            esac
          fi

          # repos arrive comma joined. ALL or no response selects every registry target, and the engine checks each
          # named repo against the registry before the mint
          REPOS="${REPOS%,}"
          if [ -z "$REPOS" ] || [ "$REPOS" = "_No response_" ] || printf '%s' "$REPOS" | tr ',' '\n' | grep -qix "ALL"; then
            REPOS="all"
          fi

          {
            echo "mode=$MODE"
            echo "repos=$REPOS"
          } >> "$GITHUB_OUTPUT"

      # The App token must be scoped to exactly the repos the engine may write. The list is
      # registry-driven (never hardcoded here): the engine's `targets` mode checks the selection against
      # the registry and prints the short names for create-github-app-token's `repositories:` input.
      - name: Compute target repositories (registry-driven)
        id: targets
        env:
          REPOS: ${{ steps.fields.outputs.repos }}
        run: |
          repos="$(python scripts/distribute_app_secrets.py targets --repos "$REPOS")"
          echo "repos=$repos" >> "$GITHUB_OUTPUT"

      # Short-lived App installation token (auto-revoked at job end), limited to the selected target
      # repos with the single grant the engine needs (secrets: write covers check's read). From the
      # writing App in ops, gated on USE_GITHUB_APP with the CICD_PAT fallback.
      - name: Mint GitHub App token (secrets write on the targets)
        id: app-token
        if: vars.USE_GITHUB_APP == 'true' && steps.fields.outputs.mode != 'bootstrap'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.KDF_WRITER_APP_ID }}
          private-key: ${{ secrets.KDF_WRITER_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ steps.targets.outputs.repos }}
          permission-secrets: write

      # The sitting's bootstrap alone. cicd's repository pair still holds the old writer, which writes the
      # read only App's pair out, cicd's own last since that ends this authority. Afterwards the pair is the
      # read only App's, which holds no Secrets permission, so this mint is refused and the mode fails closed.
      - name: Mint the bootstrap token from the repository pair (secrets write on the targets)
        id: bootstrap-token
        if: steps.fields.outputs.mode == 'bootstrap'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.KDF_APP_ID }}
          private-key: ${{ secrets.KDF_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ steps.targets.outputs.repos }}
          permission-secrets: write

      - name: Run distribution
        id: dist
        env:
          GH_TOKEN: ${{ steps.bootstrap-token.outputs.token || steps.app-token.outputs.token || secrets.CICD_PAT }}
          # Least privilege: the source values, the reader's pair in ops, are exposed only to the modes
          # that write. The engine never prints them; they flow straight into the per-target sealed box.
          KDF_APP_ID: ${{ steps.fields.outputs.mode != 'check' && secrets.KDF_READER_APP_ID || '' }}
          KDF_APP_PRIVATE_KEY: ${{ steps.fields.outputs.mode != 'check' && secrets.KDF_READER_APP_PRIVATE_KEY || '' }}
          # cicd's own pair before this run, its repository KDF_APP_ID and KDF_APP_PRIVATE_KEY, which the bootstrap's
          # mint already reads, so a failed write on cicd puts its whole pair back and a bootstrap rerun still mints
          KDF_APP_ID_PREVIOUS: ${{ steps.fields.outputs.mode != 'check' && secrets.KDF_APP_ID || '' }}
          KDF_APP_PRIVATE_KEY_PREVIOUS: ${{ steps.fields.outputs.mode != 'check' && secrets.KDF_APP_PRIVATE_KEY || '' }}
          MODE: ${{ steps.fields.outputs.mode }}
          REPOS: ${{ steps.fields.outputs.repos }}
        run: |
          set +e
          engine_mode="$MODE"
          if [ "$MODE" = "bootstrap" ]; then
            engine_mode="execute"
          fi
          python scripts/distribute_app_secrets.py "$engine_mode" --repos "$REPOS" | tee run.out
          rc=${PIPESTATUS[0]}
          set -e
          {
            echo "rc=$rc"
            echo "summary=mode=${MODE} repos='${REPOS}' (exit ${rc})"
          } >> "$GITHUB_OUTPUT"

      - name: Comment summary on the issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
          SUMMARY: ${{ steps.dist.outputs.summary }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "### Ops — App-secret distribution result"
            echo
            echo "${SUMMARY:-Distribution did not run (denied, or an earlier step failed).}"
            echo
            if [ -f run.out ]; then
              echo '```'
              # Full engine output: the audit matrix / per-target OK-FAILED lines — names,
              # repos, and timestamps only; the engine never prints a secret value.
              cat run.out
              echo '```'
            fi
            echo
            echo "_See the [Actions run](${RUN_URL}) for details. After an App private-key rotation, run mode=execute so the consumer copies match — see the owner's \`SECRET_ROTATION.md\` §8.3a in kriegerdataforge-context._"
          } > comment.md
          gh issue comment "$ISSUE" --repo "$REPO" --body-file comment.md

      # A non-zero exit is a real failure in EITHER mode: execute = a write failed; check = a
      # target could not be audited (missing copies are reported in-band with rc 0).
      - name: Fail the run if the engine errored
        if: steps.dist.outputs.rc != '0'
        env:
          RC: ${{ steps.dist.outputs.rc }}
        run: |
          echo "::error::distribution exited ${RC} — see the issue comment / Actions log."
          exit 1

      # The issue asked for one run and its result is posted, so it closes (D-047). Completed when the run succeeded,
      # not planned otherwise, so a failed run stays easy to find and can be reopened and labelled again.
      - name: Close the issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
          OUTCOME: ${{ job.status }}
        run: |
          if [ "$OUTCOME" = "success" ]; then reason="completed"; else reason="not planned"; fi
          gh issue close "$ISSUE" --repo "$REPO" --reason "$reason"
