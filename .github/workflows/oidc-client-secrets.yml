name: Ops · OIDC client secrets

# The OIDC client secrets' generations (the secrets moves' step 3, D-112). Each frontend's client secret is made here
# once by scripts/oidc_generations.py and carried from its source in cicd's ops to the hub's pending name, then to
# terraform's active name, every step recorded in the ops variable OIDC_SECRET_RECORD before the next. The client's
# engine generated entry in scripts/secret_registry.json names its homes and the runs each outside step needs. The
# owner dispatches each step and approves ops.
#
#   generate   makes the value, masks it, records its fingerprint, then writes the source and the hub's pending copy.
#              Dispatched again after a failure, it resumes on the value that landed, or makes it then when none did
#   register   registered_run, the hub's oidc-clients.yml run that registered the pending copy, checked and recorded
#   promote    writes terraform's active copy from the source
#   finish     applied_run, terraform's apply after the promotion, and deployed_run, the app's deploy after that
#              apply, both checked, then the pending copy and the source deleted and the generation done
#   recover    generation and reason, closes the open generation on purpose, its pending copy and its source
#              deleted, the active copy untouched
#   status     every generation the record keeps, never a value
#
# SECURITY. The sources, the writing App's pair and CICD_PAT live in ops alone, held to main and waiting for the
# owner's approval, and this workflow starts from a dispatch alone. A source reaches the flow's step only when its
# client and environment are selected, and the inputs reach the script as data in env vars, never in a shell string.
# The writer's token reaches cicd, the hub and terraform alone, the runs are read through a token that reads Actions
# alone, and the status step holds the record's token alone. A value the flow made is masked before any use, and no
# value reaches a variable, an output, an artifact or the log. One concurrency group serializes every step and never
# cancels a running one.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "generate, register, promote, finish, recover or status, see the header"
        required: true
        type: choice
        options: [status, generate, register, promote, finish, recover]
        default: status
      client:
        description: "The client, as scripts/secret_registry.json names it, fitness or tiffanys-space"
        required: false
        type: string
        default: ""
      environment:
        description: "dev or prod"
        required: true
        type: choice
        options: [dev, prod]
        default: dev
      registered_run:
        description: "register, the id of the hub's oidc-clients.yml run that registered the pending secret"
        required: false
        type: string
        default: ""
      applied_run:
        description: "finish, the id of terraform's run that applied the promoted secret"
        required: false
        type: string
        default: ""
      deployed_run:
        description: "finish, the id of the app's deploy run after that apply"
        required: false
        type: string
        default: ""
      generation:
        description: "recover, the open generation to close, O and its number, as status prints it"
        required: false
        type: string
        default: ""
      reason:
        description: "recover, why, in letters, digits, spaces and , . ' ( ) -"
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: oidc-client-secrets
  cancel-in-progress: false

jobs:
  authorize:
    uses: ./.github/workflows/_authorize-owner.yml

  flow:
    name: OIDC client secret ${{ inputs.mode }}
    needs: authorize
    # A rerun of failed jobs alone keeps the owner check's passed output, so both actors are tested here too.
    if: >-
      needs.authorize.outputs.authorized == 'true' &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner
    runs-on: ubuntu-slim
    # the sources, the writing App's pair and CICD_PAT live in ops alone, held to main and waiting for the owner's
    # approval
    environment: ops
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      # the repos the flow writes, cicd for the source and the record, the hub for the pending copy and terraform for
      # the active copy
      - name: List the repositories the flow writes
        id: targets
        if: inputs.mode != 'status'
        env:
          CLIENT: ${{ inputs.client }}
        run: python scripts/token_repositories.py oidc --names="$CLIENT" >> "$GITHUB_OUTPUT"

      # the repos of the runs register and finish check, the hub, terraform and the client's frontend, read alone
      - name: List the repositories whose runs the flow reads
        id: runs
        if: inputs.mode == 'register' || inputs.mode == 'finish'
        env:
          CLIENT: ${{ inputs.client }}
        run: python scripts/token_repositories.py oidc-runs --names="$CLIENT" >> "$GITHUB_OUTPUT"

      # secrets and environments write, for the homes' environment secrets
      - name: Mint GitHub App token
        id: app-token
        if: vars.USE_GITHUB_APP == 'true' && inputs.mode != 'status'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.KDF_WRITER_APP_ID }}
          private-key: ${{ secrets.KDF_WRITER_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ steps.targets.outputs.repositories }}
          permission-secrets: write
          permission-environments: write

      # Actions read alone, so the frontend a step checks a run of is never written
      - name: Mint GitHub App token (runs)
        id: runs-token
        if: vars.USE_GITHUB_APP == 'true' && (inputs.mode == 'register' || inputs.mode == 'finish')
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.KDF_WRITER_APP_ID }}
          private-key: ${{ secrets.KDF_WRITER_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ steps.runs.outputs.repositories }}
          permission-actions: read

      # The record, cicd's ops variable. GitHub's token API has no key for the Variables permission, so this mint asks
      # for no filter, taking the App's set, and is held to cicd alone.
      - name: Mint GitHub App token (variables on this repo)
        id: facts-token
        if: vars.USE_GITHUB_APP == 'true'
        # zizmor: ignore[github-app] the token API has no Variables key so this mint holds one repository in ops
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.KDF_WRITER_APP_ID }}
          private-key: ${{ secrets.KDF_WRITER_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: kriegerdataforge-cicd

      - name: Show the generations
        if: inputs.mode == 'status'
        env:
          FACTS_GH_TOKEN: ${{ steps.facts-token.outputs.token || secrets.CICD_PAT }}
        run: python scripts/oidc_generations.py --mode status

      - name: Run the flow
        if: inputs.mode != 'status'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.CICD_PAT }}
          FACTS_GH_TOKEN: ${{ steps.facts-token.outputs.token || secrets.CICD_PAT }}
          RUNS_GH_TOKEN: >-
            ${{ (inputs.mode == 'register' || inputs.mode == 'finish') &&
            (steps.runs-token.outputs.token || secrets.CICD_PAT) || '' }}
          MODE: ${{ inputs.mode }}
          CLIENT: ${{ inputs.client }}
          ENVIRONMENT: ${{ inputs.environment }}
          REGISTERED_RUN: ${{ inputs.registered_run }}
          APPLIED_RUN: ${{ inputs.applied_run }}
          DEPLOYED_RUN: ${{ inputs.deployed_run }}
          GENERATION: ${{ inputs.generation }}
          REASON: ${{ inputs.reason }}
          # each source, held in ops, reaches this step only when its client and environment are selected
          OIDC_FITNESS_DEV_SOURCE: >-
            ${{ inputs.client == 'fitness' && inputs.environment == 'dev' &&
            secrets.OIDC_FITNESS_DEV_SOURCE || '' }}
          OIDC_FITNESS_PROD_SOURCE: >-
            ${{ inputs.client == 'fitness' && inputs.environment == 'prod' &&
            secrets.OIDC_FITNESS_PROD_SOURCE || '' }}
          OIDC_TIFFANYS_SPACE_DEV_SOURCE: >-
            ${{ inputs.client == 'tiffanys-space' && inputs.environment == 'dev' &&
            secrets.OIDC_TIFFANYS_SPACE_DEV_SOURCE || '' }}
          OIDC_TIFFANYS_SPACE_PROD_SOURCE: >-
            ${{ inputs.client == 'tiffanys-space' && inputs.environment == 'prod' &&
            secrets.OIDC_TIFFANYS_SPACE_PROD_SOURCE || '' }}
        run: >-
          python scripts/oidc_generations.py --mode "$MODE" --client "$CLIENT" --environment "$ENVIRONMENT"
          --registered-run "$REGISTERED_RUN" --applied-run "$APPLIED_RUN" --deployed-run "$DEPLOYED_RUN"
          --generation "$GENERATION" --reason "$REASON"
