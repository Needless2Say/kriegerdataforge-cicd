name: Python · Mutation tests

# Reusable mutation lane for the KDF Python backends (D-027). The caller's `mutation_tests/run.py` applies
# every hand written mutant of a lane in a worktree outside the checkout, runs the tests that pin the
# rule, and restores the file. A mutant counts as killed only when its tests go red, and a survivor, a
# rule no test pins any more, fails its lane. Minutes per lane, so the PROD Gate runs it on the release
# tag and a pull request does not.
#
# One job per lane, the caller names its lanes, the tables `mutation_tests/<lane>.py` it holds. A lane may
# hold mutants of the unit, the integration and the system suite, so every job is given a Postgres and two
# databases of its own, the integration suite rolls back and the system suite commits rows.

# Least privilege, the lane clones and runs tests and never writes to the repo.
permissions:
  contents: read

on:
  workflow_call:
    inputs:
      lanes:
        description: The lanes to run, a JSON list of the caller's table names, e.g. '["core", "domain"]'
        type: string
        required: true
      python_version:
        description: Python version to use
        type: string
        default: "3.14"
      install_command:
        description: Command to install dependencies before running the mutants
        type: string
        default: "pip install -r requirements.txt"
      needs_sdk_auth:
        description: Configure git credentials for the private packages (App installation token when the caller sets USE_GITHUB_APP, else the GH_PACKAGES_PAT secret)
        type: boolean
        default: false
      ref:
        description: Git ref to check out (tag, branch or SHA). Empty checks out the caller run's own ref, the PROD Gate passes the release tag so this lane tests the exact commit being deployed.
        type: string
        default: ""

jobs:
  mutation-tests:
    name: Mutation (${{ matrix.lane }})
    runs-on: ubuntu-latest
    timeout-minutes: 90

    strategy:
      fail-fast: false
      matrix:
        lane: ${{ fromJSON(inputs.lanes) }}

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kdf
          POSTGRES_PASSWORD: kdf
          POSTGRES_DB: kdf_mutation
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kdf -d kdf_mutation"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15

    env:
      KDF_TEST_DATABASE_URL: postgresql+psycopg2://kdf:kdf@localhost:5432/kdf_mutation
      KDF_SYSTEM_DATABASE_URL: postgresql+psycopg2://kdf:kdf@localhost:5432/kdf_mutation_sys

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ inputs.python_version }}

      # Private-package auth is App-token-first (reports-ecosystem epic W2.5, ADR D-010): when
      # the calling repo opted in (USE_GITHUB_APP variable) and holds the distributed App
      # credentials (ops:distribute-app-secrets), mint a short-lived installation token —
      # contents: read only, auto-revoked at job end — for the pip git+https installs. Skipped
      # (not failed) when the caller never opted in; the install step then falls back to the
      # long-lived GH_PACKAGES_PAT exactly as before.
      - name: Mint GitHub App token for private-package installs
        id: pkg-token
        if: ${{ inputs.needs_sdk_auth && vars.USE_GITHUB_APP == 'true' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.KDF_APP_ID }}
          private-key: ${{ secrets.KDF_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: read

      # SECURITY: the token reaches git for this one step, through settings that live for the step's own processes
      #   (GIT_CONFIG_COUNT, KEY and VALUE) and are written nowhere. It used to go into the job's global git config,
      #   a file every later step could read, a test or a dependency a test imports among them. No later step
      #   holds it now, and none may name it (SDK review S1-48, kdf-sdk D-020)
      - name: Install dependencies
        env:
          GIT_CONFIG_COUNT: ${{ inputs.needs_sdk_auth && '1' || '0' }}
          GIT_CONFIG_KEY_0: ${{ inputs.needs_sdk_auth && format('url.https://__token__:{0}@github.com/.insteadOf', steps.pkg-token.outputs.token || secrets.GH_PACKAGES_PAT) || '' }}
          GIT_CONFIG_VALUE_0: https://github.com/
        run: ${{ inputs.install_command }}

      - name: Create the system test database
        env:
          PGPASSWORD: kdf
        run: psql -h localhost -U kdf -d kdf_mutation -c "CREATE DATABASE kdf_mutation_sys"

      # the lane's name reaches the shell as a variable and never as text of the script
      - name: Run the lane's mutants
        env:
          LANE: ${{ matrix.lane }}
        run: python mutation_tests/run.py --lane "$LANE" --worktree "$RUNNER_TEMP/kdf-mutation/$LANE"

      - name: Keep the lane's report
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mutation-${{ matrix.lane }}
          path: ${{ runner.temp }}/kdf-mutation/mutation-${{ matrix.lane }}.json
          if-no-files-found: ignore
