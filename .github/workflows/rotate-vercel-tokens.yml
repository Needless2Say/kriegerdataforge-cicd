name: Rotate Vercel Deployment Token

on:
  # Monthly auto-rotation: first of every month at 09:00 UTC. The new Vercel token is created with a
  # 33-day expiry, the owner's rule of 2026-11-10 for every token, and the old one is deleted at once, so
  # a month's token outlives its month by a few days of grace. This rotates the ONE shared Vercel token
  # (VERCEL_DEPLOYMENT_TOKEN) used by every app repo's CI to deploy AND by the terraform repo to
  # manage Vercel — consolidated 2026-06-30 from the former VERCEL_TOKEN + VERCEL_API_TOKEN split
  # because both were the same account-scoped token.
  #
  # NOTE (verified 2026-06-30): the token is minted team-scoped via the teamId query param
  # (VERCEL_TEAM_ID, = VERCEL_ORG_ID). An API-minted teamId token authenticates AND deploys team
  # projects (curl /v2/user + /v9/projects both 200). The earlier "Vercel can't auto-mint team tokens"
  # belief was wrong — it was a deploy-script bug (the CLI needs an explicit --token, fixed in
  # cd-*-vercel.yml). Keep this on generate; do NOT switch back to manual paste.
  #
  # THE SECRETS FENCE. The job runs in cicd's ops environment, held to main and waiting for the owner's
  # approval, where the master token, CICD_PAT and the writing App's pair live. The schedule runs only
  # once the owner sets the repository variable ARM_OPS_SCHEDULE to true, at the end of the sitting that
  # makes those writers, so no schedule meets an empty ops before then.
  schedule:
    - cron: "0 9 1 * *"

  workflow_dispatch:
    inputs:
      mode:
        description: "rotate mints and records, record-expiry records the three expiry facts alone, prove-master mints a throwaway token with the master and deletes it"
        required: true
        default: rotate
        type: choice
        options:
          - rotate
          - record-expiry
          - prove-master

permissions:
  contents: read

jobs:
  authorize:
    # Only dispatched runs have a human actor to authorize. A scheduled (cron) run's
    # github.actor is the last editor of the schedule, NOT necessarily the owner, so the
    # schedule is gated by the owner's ARM_OPS_SCHEDULE switch and by ops's required reviewer.
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/_authorize-owner.yml

  rotate:
    name: Rotate Vercel deployment token
    needs: authorize
    # A dispatch passes the owner gate (PL-076 parity) and tests both actors here too, since a rerun of
    # failed jobs alone keeps the gate's passed output. The schedule runs only once the owner armed it.
    # always() lets this job evaluate when authorize is skipped on schedule. A rerun keeps the event's
    # name, so any attempt after the first, a scheduled run's too, is the owner's alone.
    if: >-
      always() &&
      github.repository == 'Needless2Say/kriegerdataforge-cicd' &&
      ((github.event_name == 'schedule' && vars.ARM_OPS_SCHEDULE == 'true') ||
        (github.event_name == 'workflow_dispatch' &&
          needs.authorize.result == 'success' && needs.authorize.outputs.authorized == 'true' &&
          github.actor == github.repository_owner &&
          github.triggering_actor == github.repository_owner)) &&
      (github.run_attempt == '1' || github.triggering_actor == github.repository_owner)
    runs-on: ubuntu-slim
    # the master token, CICD_PAT and the writing App's pair live in ops alone, held to main and waiting
    # for the owner's approval
    environment: ops
    env:
      # the schedule always rotates, a dispatch does what it chose
      MODE: ${{ inputs.mode || 'rotate' }}

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"

      - name: Install rotation dependencies
        run: pip install -r scripts/requirements.txt

      # Short-lived GitHub App installation token from the writing App (auto-revoked at job end). Two grants:
      #   * secrets: write      — write the shared VERCEL_DEPLOYMENT_TOKEN as a REPOSITORY secret in
      #                           every target repo (it is one global value, no longer per-env).
      #   * environments: write — DELETE the retired per-environment copies so they can't shadow the
      #                           repo value (env wins over repo).
      # Gated on USE_GITHUB_APP, falls back to CICD_PAT. The token names the repos the rotation writes, read from the
      # registry as rotate_secret.py reads them (D-085, design 5.7).
      - name: List the repositories the rotation writes
        id: targets
        if: env.MODE == 'rotate'
        run: python scripts/token_repositories.py secrets --names=VERCEL_DEPLOYMENT_TOKEN >> "$GITHUB_OUTPUT"

      - name: Mint GitHub App token
        id: app-token
        if: env.MODE == 'rotate' && vars.USE_GITHUB_APP == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.KDF_WRITER_APP_ID }}
          private-key: ${{ secrets.KDF_WRITER_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ steps.targets.outputs.repositories }}
          permission-secrets: write
          permission-environments: write

      - name: Rotate token
        if: env.MODE == 'rotate'
        env:
          VERCEL_MASTER_TOKEN: ${{ secrets.VERCEL_MASTER_TOKEN }}
          # Scopes the minted token to the Vercel team (the VERCEL_ORG_ID value) — without it the token
          # is personal-scoped and Vercel rejects it for team projects.
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.CICD_PAT }}
        run: |
          python scripts/rotate_secret.py \
            --mode generate \
            --secrets VERCEL_DEPLOYMENT_TOKEN

      # The expiry facts (the secrets fence, design 5.5 item 9). The weekly monitor runs outside ops and
      # holds neither CICD_PAT nor the master token, so this run reads each recorded token live and keeps
      # its expiry as a cicd repository variable, nothing secret. A token from the writing App on this
      # repo alone. GitHub's token API has no key for the Variables permission, so a mint asking for
      # `variables` is refused (422, run 42728994281). It asks for no filter, taking the App's set, and
      # is held to this one repository instead, in ops after the owner's approval.
      - name: Mint GitHub App token (variables on this repo)
        id: facts-token
        if: env.MODE != 'prove-master' && vars.USE_GITHUB_APP == 'true'
        # zizmor: ignore[github-app] the token API has no Variables key so this mint holds one repository in ops
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.KDF_WRITER_APP_ID }}
          private-key: ${{ secrets.KDF_WRITER_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: kriegerdataforge-cicd

      - name: Record the expiry facts
        if: env.MODE != 'prove-master'
        env:
          CICD_PAT: ${{ secrets.CICD_PAT }}
          VERCEL_MASTER_TOKEN: ${{ secrets.VERCEL_MASTER_TOKEN }}
          GH_TOKEN: ${{ steps.facts-token.outputs.token || secrets.CICD_PAT }}
        # The packages and npm tokens' facts are the staged distribution's alone, written from the token it sends
        # (D-099), so this run never records them and no copy read before a distribution overwrites a newer fact.
        run: |
          python scripts/rotate_secret.py \
            --mode record-expiry \
            --secrets CICD_PAT,VERCEL_MASTER_TOKEN,VERCEL_DEPLOYMENT_TOKEN

      # The sitting makes a fresh master token straight into ops, and this proves it mints before anything
      # depends on it. The throwaway token is deleted at once and its value never printed.
      - name: Prove the master token
        if: env.MODE == 'prove-master'
        env:
          VERCEL_MASTER_TOKEN: ${{ secrets.VERCEL_MASTER_TOKEN }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
        run: python scripts/rotate_secret.py --mode prove-master
