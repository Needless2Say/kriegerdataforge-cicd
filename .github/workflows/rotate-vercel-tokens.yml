name: Rotate Vercel Deployment Token

on:
  # THE GENERATIONS (the secrets fence, step 10, ADR D-100). The ONE shared Vercel token (VERCEL_DEPLOYMENT_TOKEN),
  # used by every app repo's deploys AND by the terraform repo to manage Vercel, lives in each repo's dev and prod
  # environment beside the variable VERCEL_TOKEN_GENERATION. scripts/token_generations.py rotates it as generations,
  # each recorded in cicd's ops (the variable VERCEL_TOKEN_RECORD) before any target is written, its predecessors
  # revoked by a reap six hours after its last write, never at the mint. Every token lasts 33 days and is rotated on
  # the 1st, the owner's rule of 2026-11-10.
  #
  # The schedule is daily. Its first job, due, outside ops and holding no secret, reads the public facts (the cicd
  # repository variable VERCEL_TOKEN_FACTS) and says whether a rotation or a reap is due, and the ops job runs only
  # then, so a day with nothing due asks no approval and a cancelled or late run is tried again the next day. Before
  # the first generation nothing is due, since the owner starts the token's move by dispatch (the plan's step 11).
  # No workflow dispatches another, so the owner check stays as it is.
  #
  # NOTE (verified 2026-06-30): the token is minted team-scoped via the teamId query param (VERCEL_TEAM_ID, =
  # VERCEL_ORG_ID). An API-minted teamId token authenticates AND deploys team projects. Keep this on generate.
  #
  # THE SECRETS FENCE. The ops job runs in cicd's ops environment, held to main and waiting for the owner's approval,
  # where the master token, CICD_PAT and the writing App's pair live. The schedule runs only once the owner sets the
  # repository variable ARM_OPS_SCHEDULE to true.
  schedule:
    - cron: "0 9 * * *"

  workflow_dispatch:
    inputs:
      mode:
        description: "rotate mints a generation, reap revokes its predecessors six hours after its last write, revoke-now revokes them at once, retire-repo-copies deletes the repository copies, record-expiry records the three expiry facts alone, prove-master mints a throwaway token with the master and deletes it"
        required: true
        default: rotate
        type: choice
        options:
          - rotate
          - reap
          - revoke-now
          - retire-repo-copies
          - record-expiry
          - prove-master
      generation:
        description: "revoke-now and retire-repo-copies, the newest generation's id, such as G1"
        required: false
        default: ""
        type: string
      verified:
        description: "retire-repo-copies, every target with a yes for that generation printed after it completed, repo:env comma separated"
        required: false
        default: ""
        type: string

permissions:
  contents: read

# Every entry point of the token shares this one group. A group keeps one waiting run, a newer waiting run replaces
# it, and a running job is never cancelled, so each entry point is safe to lose, the schedule trying again the next
# day and a dispatch sent again. Correctness is the record's, reloaded by every entry point after the group lets it
# run (D-100).
concurrency:
  group: vercel-token-engine
  cancel-in-progress: false

jobs:
  due:
    # The schedule's first job, outside ops and holding no secret. It reads the public facts alone. It runs on the
    # owner's dispatch too, as every job here admits the owner, and a dispatch then does the mode it chose.
    if: >-
      github.repository == 'Needless2Say/kriegerdataforge-cicd' &&
      ((github.event_name == 'schedule' && vars.ARM_OPS_SCHEDULE == 'true') ||
        (github.event_name == 'workflow_dispatch' &&
          github.actor == github.repository_owner &&
          github.triggering_actor == github.repository_owner)) &&
      (github.run_attempt == '1' || github.triggering_actor == github.repository_owner)
    runs-on: ubuntu-slim
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.due.outputs.mode }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Read the public facts
        id: due
        env:
          FACTS: ${{ vars.VERCEL_TOKEN_FACTS }}
        run: python scripts/token_generations.py due --facts="$FACTS" >> "$GITHUB_OUTPUT"

  authorize:
    # Only dispatched runs have a human actor to authorize. A scheduled (cron) run's
    # github.actor is the last editor of the schedule, NOT necessarily the owner, so the
    # schedule is gated by the owner's ARM_OPS_SCHEDULE switch and by ops's required reviewer.
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/_authorize-owner.yml

  rotate:
    name: Rotate Vercel deployment token
    needs: [due, authorize]
    # A dispatch passes the owner gate (PL-076 parity) and tests both actors here too, since a rerun of
    # failed jobs alone keeps the gate's passed output. The schedule runs only once the owner armed it and
    # only when its due job found something to do. always() lets this job evaluate when a needed job is
    # skipped. A rerun keeps the event's name, so any attempt after the first is the owner's alone.
    if: >-
      always() &&
      github.repository == 'Needless2Say/kriegerdataforge-cicd' &&
      ((github.event_name == 'schedule' && vars.ARM_OPS_SCHEDULE == 'true' &&
          needs.due.result == 'success' &&
          (needs.due.outputs.mode == 'rotate' || needs.due.outputs.mode == 'reap')) ||
        (github.event_name == 'workflow_dispatch' &&
          needs.authorize.result == 'success' && needs.authorize.outputs.authorized == 'true' &&
          github.actor == github.repository_owner &&
          github.triggering_actor == github.repository_owner)) &&
      (github.run_attempt == '1' || github.triggering_actor == github.repository_owner)
    runs-on: ubuntu-slim
    # the master token, CICD_PAT and the writing App's pair live in ops alone, held to main and waiting
    # for the owner's approval
    environment: ops
    env:
      # the schedule does what its due job found, a dispatch what it chose
      MODE: ${{ inputs.mode || needs.due.outputs.mode }}

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"

      - name: Install rotation dependencies
        run: pip install -r scripts/requirements.txt

      # Short-lived GitHub App installation token from the writing App (auto-revoked at job end), on the repos the
      # rotation writes, read from the registry: their dev and prod environments and the retired repository copies.
      #   * secrets: write      — write each environment copy, and delete a repository copy once retired.
      #   * environments: write — write each environment's VERCEL_TOKEN_GENERATION variable.
      # Gated on USE_GITHUB_APP, falls back to CICD_PAT (D-085, design 5.7).
      - name: List the repositories the rotation writes
        id: targets
        if: env.MODE == 'rotate' || env.MODE == 'retire-repo-copies'
        run: python scripts/token_repositories.py secrets --names=VERCEL_DEPLOYMENT_TOKEN >> "$GITHUB_OUTPUT"

      - name: Mint GitHub App token
        id: app-token
        if: (env.MODE == 'rotate' || env.MODE == 'retire-repo-copies') && vars.USE_GITHUB_APP == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.KDF_WRITER_APP_ID }}
          private-key: ${{ secrets.KDF_WRITER_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ steps.targets.outputs.repositories }}
          permission-secrets: write
          permission-environments: write

      # The record in ops, the public facts and the expiry facts, all cicd's (the secrets fence, design 5.5 items 3
      # and 9). A token from the writing App on this repo alone. GitHub's token API has no key for the Variables
      # permission, so a mint asking for `variables` is refused (422, run 42728994281). It asks for no filter, taking
      # the App's set, and is held to this one repository instead, in ops after the owner's approval.
      - name: Mint GitHub App token (variables on this repo)
        id: facts-token
        if: env.MODE != 'prove-master' && vars.USE_GITHUB_APP == 'true'
        # zizmor: ignore[github-app] the token API has no Variables key so this mint holds one repository in ops
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.KDF_WRITER_APP_ID }}
          private-key: ${{ secrets.KDF_WRITER_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: kriegerdataforge-cicd

      # Every entry point loads the record when it starts, after the group lets it run. The inputs reach the engine
      # through the environment, each bound to its option with =, never as a word of the command.
      - name: Run the generations
        if: env.MODE == 'rotate' || env.MODE == 'reap' || env.MODE == 'revoke-now' || env.MODE == 'retire-repo-copies'
        env:
          VERCEL_MASTER_TOKEN: ${{ secrets.VERCEL_MASTER_TOKEN }}
          # Scopes the minted token to the Vercel team (the VERCEL_ORG_ID value) — without it the token
          # is personal-scoped and Vercel rejects it for team projects.
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.CICD_PAT }}
          FACTS_GH_TOKEN: ${{ steps.facts-token.outputs.token || secrets.CICD_PAT }}
          GENERATION: ${{ inputs.generation }}
          VERIFIED: ${{ inputs.verified }}
        run: python scripts/token_generations.py "$MODE" --generation="$GENERATION" --verified="$VERIFIED"

      # The record as this run left it, read fresh since the vars context holds it as the job began. Its newest
      # generation's token id, not secret, is named only when that generation is complete and every repository copy
      # retired, so no target holds an older token. The step never fails, an unreadable record naming none.
      - name: Name the current generation's token
        id: current
        if: ${{ !cancelled() && env.MODE != 'prove-master' }}
        env:
          FACTS_GH_TOKEN: ${{ steps.facts-token.outputs.token || secrets.CICD_PAT }}
        run: python scripts/token_generations.py current >> "$GITHUB_OUTPUT"

      # The expiry facts (the secrets fence, design 5.5 item 9). The weekly monitor runs outside ops and holds
      # neither CICD_PAT nor the master token, so this run reads each recorded token live and keeps its expiry as a
      # cicd repository variable, nothing secret. The deployment token's is the current generation's token's when
      # one is named, else the earliest among the live tokens of its name, so a predecessor still serving a target
      # stays seen while one can, and the monthly issue closes at the sitting once none can.
      - name: Record the expiry facts
        # after a failed generation's step too, so the facts follow what the run left
        if: ${{ !cancelled() && env.MODE != 'prove-master' }}
        env:
          CICD_PAT: ${{ secrets.CICD_PAT }}
          VERCEL_MASTER_TOKEN: ${{ secrets.VERCEL_MASTER_TOKEN }}
          VERCEL_TOKEN_CURRENT_ID: ${{ steps.current.outputs.token_id }}
          GH_TOKEN: ${{ steps.facts-token.outputs.token || secrets.CICD_PAT }}
        # The packages and npm tokens' facts are the staged distribution's alone, written from the token it sends
        # (D-099), so this run never records them and no copy read before a distribution overwrites a newer fact.
        run: |
          python scripts/rotate_secret.py \
            --mode record-expiry \
            --secrets CICD_PAT,VERCEL_MASTER_TOKEN,VERCEL_DEPLOYMENT_TOKEN

      # The sitting makes a fresh master token straight into ops, and this proves it mints before anything
      # depends on it. The throwaway token is deleted at once and its value never printed.
      - name: Prove the master token
        if: env.MODE == 'prove-master'
        env:
          VERCEL_MASTER_TOKEN: ${{ secrets.VERCEL_MASTER_TOKEN }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
        run: python scripts/rotate_secret.py --mode prove-master
