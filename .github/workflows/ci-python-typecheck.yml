name: Python · Type-check (mypy)

# N3b: least-privilege — read-only reusable type-check lane (cap the GITHUB_TOKEN).
permissions:
  contents: read

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to check out (tag, branch or SHA). Empty checks out the caller run's own ref, a release dispatch passes the release tag so this lane judges the exact commit being deployed.
        type: string
        default: ""
      python_version:
        description: Python version to use
        type: string
        default: "3.14"
      install_command:
        description: Command to install dependencies before type-checking
        type: string
        default: "pip install -r requirements.txt"
      typecheck_command:
        description: Full mypy command to run
        type: string
        default: "python -m mypy api/"
      needs_sdk_auth:
        description: Configure git credentials for the private packages (App installation token when the caller sets USE_GITHUB_APP, else the GH_PACKAGES_PAT secret)
        type: boolean
        default: false

jobs:
  type-check:
    name: Type-check (mypy)
    runs-on: ubuntu-slim

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ inputs.python_version }}

      # Private-package auth is App-token-first (reports-ecosystem epic W2.5, ADR D-010): when
      # the calling repo opted in (USE_GITHUB_APP variable) and holds the distributed App
      # credentials (ops:distribute-app-secrets), mint a short-lived installation token —
      # contents: read only, auto-revoked at job end — for the pip git+https installs. Skipped
      # (not failed) when the caller never opted in; the install step then falls back to the
      # long-lived GH_PACKAGES_PAT exactly as before.
      - name: Mint GitHub App token for private-package installs
        id: pkg-token
        if: ${{ inputs.needs_sdk_auth && vars.USE_GITHUB_APP == 'true' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.KDF_APP_ID }}
          private-key: ${{ secrets.KDF_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: read

      # The slim runner lacks libpq, so psycopg2 (built from source — it ships
      # no manylinux wheels) fails with "pg_config executable not found".
      # Provide the build dependency so `pip install -r requirements.txt` works.
      - name: Install libpq (psycopg2 build dependency)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpq-dev

      # SECURITY: the token reaches git for this one step, through settings that live for the step's own processes
      #   (GIT_CONFIG_COUNT, KEY and VALUE) and are written nowhere. It used to go into the job's global git config,
      #   a file every later step could read, a test or a dependency a test imports among them. No later step
      #   holds it now, and none may name it (SDK review S1-48, kdf-sdk D-020)
      - name: Install dependencies
        env:
          GIT_CONFIG_COUNT: ${{ inputs.needs_sdk_auth && '1' || '0' }}
          GIT_CONFIG_KEY_0: ${{ inputs.needs_sdk_auth && format('url.https://__token__:{0}@github.com/.insteadOf', steps.pkg-token.outputs.token || secrets.GH_PACKAGES_PAT) || '' }}
          GIT_CONFIG_VALUE_0: https://github.com/
        run: ${{ inputs.install_command }}

      - name: Run mypy
        run: ${{ inputs.typecheck_command }}
