name: Distribute GH_PACKAGES_PAT

on:
  # Manual only — triggered after you create a new fine-grained PAT and store it
  # as GH_PACKAGES_PAT_NEW in kriegerdataforge-cicd's ops environment, never a repository secret,
  # which every branch's workflow could read.
  #
  # Full rotation flow:
  #   1. Create a new fine-grained PAT at github.com/settings/tokens
  #      Name: "kdf-packages-read"
  #      Expiration: 1 year
  #      Repository access: kriegerdataforge-python-sdk only
  #      Permission: Contents → Read-only
  #   2. Stage it in ops from a prompt, never the command line:
  #      gh secret set GH_PACKAGES_PAT_NEW --env ops --repo Needless2Say/kriegerdataforge-cicd
  #   3. Run this workflow (Actions → Distribute GH_PACKAGES_PAT → Run workflow), and approve ops.
  #   4. After it succeeds, update the GH_PACKAGES_PAT check.expiry in scripts/secret_registry.json
  #      to the new expiry date (YYYY-MM-DD) and commit the change.
  #   5. Delete the GH_PACKAGES_PAT_NEW secret from ops (it is no longer needed).
  #   6. Optionally revoke the old PAT: github.com/settings/tokens → find old token → Revoke.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authorize:
    uses: ./.github/workflows/_authorize-owner.yml

  distribute:
    name: Distribute GH_PACKAGES_PAT
    needs: authorize
    # Fail-closed owner gate (PL-076 parity): the reusable gate exit 1s on a non-owner (so the
    # implicit needs-success requirement skips this job) AND we re-assert its explicit output.
    # A rerun of failed jobs alone keeps the check's passed output, so both actors are tested here too.
    if: >-
      needs.authorize.outputs.authorized == 'true' &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner
    runs-on: ubuntu-slim

    # The staged GH_PACKAGES_PAT_NEW, the writing App's pair and CICD_PAT live in ops alone, held to main and waiting
    # for the owner's approval.
    environment: ops

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      # Short-lived GitHub App installation token (auto-revoked at job end; effective lifetime =
      # job runtime, not the 1-hour nominal TTL). Downscoped to secrets:write — PL-107:
      # GH_PACKAGES_PAT now lives ONLY as a REPOSITORY-level Actions secret (github_repo_secrets)
      # on the four SDK-consuming repos, and repository secrets are gated by the "Secrets"
      # permission, NOT "Environments" (the registry entry has no github_env_secrets). Gated on
      # USE_GITHUB_APP, falls back to CICD_PAT. The token names the repos the paste writes, read from the registry as
      # rotate_secret.py reads them (D-085, design 5.7).
      - name: List the repositories the paste writes
        id: targets
        run: python scripts/token_repositories.py secrets --names=GH_PACKAGES_PAT >> "$GITHUB_OUTPUT"

      - name: Mint GitHub App token
        id: app-token
        if: vars.USE_GITHUB_APP == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.KDF_WRITER_APP_ID }}
          private-key: ${{ secrets.KDF_WRITER_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ steps.targets.outputs.repositories }}
          permission-secrets: write

      - name: Distribute new PAT
        env:
          # The staged new PAT (created in the GitHub UI) feeds the engine's paste mode.
          STAGED_SECRET_VALUE: ${{ secrets.GH_PACKAGES_PAT_NEW }}
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.CICD_PAT }}
        run: python scripts/rotate_secret.py --mode paste --secrets GH_PACKAGES_PAT
