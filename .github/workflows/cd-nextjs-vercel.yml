# Reusable CD workflow — Next.js → Vercel
#
# Called by consumer repos to deploy a Next.js frontend to a Vercel project.
# The `environment` input names the GitHub Environment the deploy job runs under:
#   1. Loads its secrets. A job with `environment:` reads repository AND environment
#      secrets together, so the shared token lives at REPOSITORY level (one value
#      everywhere) while the per-env values stay environment-scoped.
#   2. Holds those secrets to the branch rule of the calling repository's environment,
#      `main` alone, with no reviewer. The rule binds the run's ref, never the code the
#      run checks out, so the `release` job resolves the tag to a commit on main and the
#      deploy checks out that commit by its SHA. The deployer authorization gate below
#      decides who deploys.
#
# Repository secrets (one global value — set at repo level, NOT per environment):
#   VERCEL_DEPLOYMENT_TOKEN — shared Vercel deploy/management token
#   GH_NPM_TOKEN            — CLASSIC read:packages PAT for the private
#                             @needless2say/* GitHub Packages scope. Required by
#                             any consumer whose package.json depends on it; the
#                             build happens HERE (see the prebuilt note below), so
#                             this Actions secret is the ONLY place it is needed —
#                             the Vercel projects do not carry an npm credential.
# Environment secrets (set per environment in the caller repo):
#   VERCEL_ORG_ID      — Vercel team / org ID
#   VERCEL_PROJECT_ID  — Vercel project ID for the target environment
# Optional environment secret:
#   VERCEL_AUTOMATION_BYPASS_SECRET — the project's "Protection Bypass for Automation" value, sent on a bot's
#                                     smoke of its candidate's `smoke_path` route
#
# Every deploy stamps its deployment with the version, the source commit, the run id and attempt, and the time the
# deploy job's first step recorded. The owner's deploy promotes in its one `--prod` call, the live target read
# immediately before it and an older candidate refused. A bot's redeploy, admitted by the deployer check on its first
# dispatch alone, redeploys the live release only, deployed without the domains, smoked on `smoke_path` through the
# bypass, the live target read again, then promoted.
#
# Usage (consumer repo .github/workflows/cd.yml):
#   jobs:
#     deploy:
#       uses: Needless2Say/kriegerdataforge-cicd/.github/workflows/cd-nextjs-vercel.yml@main
#       permissions:
#         contents: read
#         actions: read   # the PROD gate lists this repo's PROD Gate runs for the release (D-027)
#       with:
#         environment: ${{ inputs.environment }}
#         version: ${{ inputs.version }}
#       secrets: inherit

name: CD — Next.js → Vercel (reusable)

on:
  workflow_call:
    inputs:
      environment:
        description: 'Target GitHub Environment ("dev" or "prod")'
        required: true
        type: string
      version:
        description: 'Version to deploy (e.g. 1.2.0). Specify an older version to roll back.'
        required: true
        type: string
      smoke_path:
        description: 'A route that loads the env module, which a bot smokes on its candidate before promoting it'
        required: false
        type: string
        default: ''

jobs:
  # ── Deployer authorization gate ───────────────────────────────────────────
  # Runs BEFORE the deploy job, and BEFORE the GitHub Environment approval is
  # requested. Verifies the user who dispatched this run is an approved deployer
  # for this repo + environment, per the central allow-list in
  # kriegerdataforge-cicd (scripts/deployer_registry.json). Fails closed.
  authorize:
    name: Authorize deployer
    runs-on: ubuntu-slim
    permissions:
      contents: read
    # human, or bot for the dispatcher's bot, admitted only on this deploy profile of its own first dispatch
    outputs:
      path: ${{ steps.gate.outputs.path }}
    steps:
      - name: Check out deployer registry (kriegerdataforge-cicd)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: Needless2Say/kriegerdataforge-cicd
          ref: main
          sparse-checkout: scripts
          path: _kdf_cicd
          # The cicd repo is public, so the caller's default github.token can read it.
          # (If cicd ever goes private, this checkout needs a read-only token with access
          # to it — see KDF docs/engineering/GITHUB_FUTURE_ENHANCEMENTS.md.)
          token: ${{ github.token }}

      - name: Verify deployer is approved
        id: gate
        run: python3 _kdf_cicd/scripts/check_deployer.py
        env:
          DEPLOY_REPO: ${{ github.repository }}
          DEPLOY_ACTOR: ${{ github.triggering_actor }}
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
          # a bot is known by its numeric id alone and admitted only where this deploy job names its profile, from
          # the caller workflow and ref its grant names, on a workflow_dispatch's first attempt
          DEPLOY_ACTOR_ID: ${{ github.actor_id }}
          DEPLOY_PROFILE: redeploy
          DEPLOY_EVENT: ${{ github.event_name }}
          DEPLOY_WORKFLOW_REF: ${{ github.workflow_ref }}
          DEPLOY_RUN_ATTEMPT: ${{ github.run_attempt }}

  # ── PROD gate ──────────────────────────────────────────────────────────────
  # Runs after the deployer authorization and before the deploy job. A release deploys to
  # prod only when this repo's PROD Gate workflow (prod-gate.yml, D-027) has a successful
  # run for the release. The PROD Gate is dispatched with the release version and runs, on
  # the tag, the commit the deploy job checks out below, the repo's checks, its unit,
  # integration, system and mutation suites and its E2E journey, and its last job, named
  # PROD Gate v<version>, passes only when every one of them passed. So this one check
  # certifies the whole suite. A run of the E2E workflow alone does not count, nor does a
  # PROD Gate dispatched on a branch that is not the default one. On dev the same lookup
  # is reported and never denies, DEV is the soak that precedes the PROD Gate. Fails
  # closed on prod, and the step summary
  # names the run that tested the release when it passes (scripts/check_prod_gate.py). The
  # runs listing needs actions: read, which the calling cd.yml grants on its deploy job.
  verify-prod-gate:
    name: Verify the PROD Gate passed for v${{ inputs.version }}
    needs: [authorize, release]
    # a rerun of failed jobs alone keeps the deployer check's pass, so only the login that started the run reruns it
    if: github.actor == github.triggering_actor
    runs-on: ubuntu-slim
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out the PROD gate (kriegerdataforge-cicd)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: Needless2Say/kriegerdataforge-cicd
          ref: main
          sparse-checkout: scripts
          path: _kdf_cicd
          token: ${{ github.token }}

      # A bot's redeploy is held instead, in the deploy job before anything is installed, to the version and commit
      # its project's live production target carries, a deployment a gated deploy made, so a live PROD release
      # whose gate run lies beyond this search's window is still redeployed. A human release keeps this gate.
      - name: Verify a successful PROD Gate run exists for this release
        if: needs.authorize.outputs.path != 'bot'
        run: python3 _kdf_cicd/scripts/check_prod_gate.py
        env:
          DEPLOY_REPO: ${{ github.repository }}
          DEPLOY_VERSION: ${{ inputs.version }}
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
          EXPECTED_COMMIT: ${{ needs.release.outputs.sha }}
          GH_TOKEN: ${{ github.token }}

      - name: The bot's redeploy, held to the live release in the deploy job
        if: needs.authorize.outputs.path == 'bot'
        run: echo "the bot redeploys the live release alone, checked against the live target's stamp before any install"

  # ── Release check ──────────────────────────────────────────────────────────
  # The environment's branch rule binds the run's ref, never the code the run checks out. So
  # before any job that names an environment, the release's tag is resolved to a commit and
  # refused unless that commit is on main, whose every commit the owner merged, and every
  # later job checks out that commit by its SHA and compares its checkout with it, never the
  # tag (scripts/check_release_commit.py).
  release:
    name: Check v${{ inputs.version }} is on main
    needs: authorize
    # a rerun of failed jobs alone keeps the deployer check's pass, so only the login that started the run reruns it
    if: github.actor == github.triggering_actor
    runs-on: ubuntu-slim
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.check.outputs.sha }}
    steps:
      - name: Check out the caller with its history and tags
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Check out the release check (kriegerdataforge-cicd)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: Needless2Say/kriegerdataforge-cicd
          ref: main
          sparse-checkout: scripts
          path: _kdf_cicd
          token: ${{ github.token }}
          persist-credentials: false

      - name: Resolve the tag and refuse a commit off main
        id: check
        run: python3 _kdf_cicd/scripts/check_release_commit.py
        env:
          DEPLOY_VERSION: ${{ inputs.version }}

  deploy:
    name: Deploy (${{ inputs.environment }})
    needs: [authorize, release, verify-prod-gate]
    # a rerun of failed jobs alone keeps the deployer check's pass, so only the login that started the run reruns it
    if: github.actor == github.triggering_actor
    runs-on: ubuntu-slim

    # Names the caller repo's GitHub Environment, held to main, and the job reads its secrets.
    # It deploys the commit the release job resolved, never the tag. No id-token permission:
    # the pinned Vercel CLI never requests a GitHub OIDC token.
    environment: ${{ inputs.environment }}

    # One group per app and environment, so the owner's deploys and a bot's redeploys wait on each other, the
    # freshness check and the promotion inside it. Its name is the reusable's own and none a caller's can equal,
    # since a called job whose group has its caller's name waits on itself (the callers hold `cd-<environment>`).
    concurrency:
      group: kdf-deploy-${{ github.repository }}-${{ inputs.environment }}
      cancel-in-progress: false

    permissions:
      contents: read

    steps:
      # The stamp's start, before any setting is read. Receipts read the attempt's start from GitHub, and the
      # freshness rule compares this time with the live deployment's.
      - name: Record the start, before any setting is read
        id: start
        run: echo "started=$(date -u +%Y-%m-%dT%H:%M:%S.%3NZ)" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.release.outputs.sha }}

      - name: Compare the checkout with the release commit
        env:
          RELEASE_SHA: ${{ needs.release.outputs.sha }}
        run: |
          head="$(git rev-parse HEAD)"
          if [ -z "${RELEASE_SHA}" ] || [ "${head}" != "${RELEASE_SHA}" ]; then
            echo "::error::the checkout is ${head}, not the commit '${RELEASE_SHA}' the release check resolved"
            exit 1
          fi
          echo "deploying ${head}, the commit the release check resolved"

      # The deployer check's path decides every later branch, so a run whose path is neither, an output GitHub
      # withheld for one, stops here. A bot is admitted on its first attempt alone, and a rerun of failed jobs keeps
      # the check's pass from attempt 1, so a bot's later attempt stops here too.
      - name: Refuse an unknown path or a bot's rerun
        if: >-
          (needs.authorize.outputs.path != 'bot' && needs.authorize.outputs.path != 'human')
          || (needs.authorize.outputs.path == 'bot' && github.run_attempt != '1')
        run: |
          echo "::error::the deployer check's path is '${PATH_TAKEN}' on attempt ${GITHUB_RUN_ATTEMPT}, and a deploy runs on the human path or on a bot's first attempt alone"
          exit 1
        env:
          PATH_TAKEN: ${{ needs.authorize.outputs.path }}

      # A bot redeploys its project's live release alone, the version and the exact commit the live production
      # target's stamp carries, checked here before anything is installed or built. A missing stamp refuses it.
      - name: Hold the bot to the live release
        if: needs.authorize.outputs.path == 'bot'
        uses: Needless2Say/kriegerdataforge-cicd/.github/actions/deploy-stamp@main
        with:
          command: bot
          token: ${{ secrets.VERCEL_DEPLOYMENT_TOKEN }}
          org: ${{ secrets.VERCEL_ORG_ID }}
          project: ${{ secrets.VERCEL_PROJECT_ID }}
          version: ${{ inputs.version }}
          commit: ${{ needs.release.outputs.sha }}

      - name: Refuse a bot's run with no smoke route
        if: needs.authorize.outputs.path == 'bot' && !startsWith(inputs.smoke_path, '/')
        run: |
          echo "::error::a bot's candidate is smoked before it serves, and this caller passes no smoke_path route"
          exit 1

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          # Must match BOTH the ci-nextjs-* workflows' node_version input (default
          # "24" — no consumer overrides it) AND each Vercel project's Node.js
          # Version setting. Since the build now happens here and ships prebuilt,
          # this is the version the deployed artifact is actually compiled on; the
          # step after `vercel pull` asserts the project agrees.
          #
          # Raising this REQUIRES a Vercel CLI that accepts the new major — the
          # supported list is baked into @vercel/build-utils, and the CLI rejects
          # anything outside it. 58.5.1 accepts up to 24.x; the previous 48.0.0
          # pin stopped at 22.x, which is what broke the first Node 24 deploy.
          node-version: "24"
          cache: "npm"

      - name: Validate Vercel project binding
        run: |
          if [ -z "${VERCEL_PROJECT_ID:-}" ]; then
            echo "❌  VERCEL_PROJECT_ID is not set in the GitHub Environment."
            echo "    Without it the Vercel CLI falls back to org-wide project discovery"
            echo "    and may deploy to the wrong project or trigger other projects."
            echo "    Set VERCEL_PROJECT_ID in the '$DEPLOY_ENVIRONMENT' environment"
            echo "    secrets for this repo and re-run."
            exit 1
          fi
          echo "✅  Deploying to Vercel project: $VERCEL_PROJECT_ID"
        env:
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}

      - name: Install Vercel CLI
        # Pin the Vercel CLI to an exact version instead of `npx vercel`, which
        # resolves "latest" from the registry at deploy time. This job holds
        # VERCEL_DEPLOYMENT_TOKEN, so floating the CLI is a poisoned-pipeline /
        # dependency-chain risk (CICD-SEC-3 / SLSA). Bump via Dependabot.
        run: npm install -g vercel@58.5.1

      - name: Prepare Vercel token
        id: token
        # A VERCEL_DEPLOYMENT_TOKEN secret pasted by hand often carries a trailing newline/space, which
        # the Vercel CLI rejects ("The specified token is not valid") even though the token itself is valid.
        # Trim once here. The TRIMMED value is a different string from the raw secret, so GitHub's
        # automatic masking does not cover it — ::add-mask:: is what keeps it out of the logs. It goes to
        # a step OUTPUT that the two steps calling Vercel's API read, `vercel pull` and `vercel deploy`,
        # and never to $GITHUB_ENV, which every later step would inherit, `vercel build`'s own install
        # and every dependency lifecycle script included (auth UI register row 40). Only the LENGTH is
        # echoed, for debugging.
        run: |
          TOKEN="$(printf '%s' "$VERCEL_DEPLOYMENT_TOKEN" | tr -d '[:space:]')"
          if [ -z "$TOKEN" ]; then
            echo "::error::VERCEL_DEPLOYMENT_TOKEN is empty in this environment — cicd's token rotation writes it into each repo's dev and prod (D-100)."
            exit 1
          fi
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"
          echo "VERCEL_DEPLOYMENT_TOKEN trimmed length=${#TOKEN}"
        env:
          VERCEL_DEPLOYMENT_TOKEN: ${{ secrets.VERCEL_DEPLOYMENT_TOKEN }}

      # The token's generation (the secrets fence, step 10, D-100). Compares the token with this environment's
      # VERCEL_TOKEN_GENERATION and prints its generation and yes or no, never the token, and never fails the
      # deploy, since the deploy's own call to Vercel proves the token works.
      - name: Compare the token with its generation
        uses: Needless2Say/kriegerdataforge-cicd/.github/actions/token-generation@main
        with:
          token: ${{ secrets.VERCEL_DEPLOYMENT_TOKEN }}
          generation: ${{ vars.VERCEL_TOKEN_GENERATION }}

      # ── Why this deploys a PREBUILT artifact ──────────────────────────────────
      # A plain `vercel --prod` uploads SOURCE and builds on Vercel's machine. That
      # remote builder cannot see any GitHub Actions secret, so `npm install` there
      # has no credential for the private @needless2say/* GitHub Packages scope and
      # dies with "401 … cannot be authenticated with the token provided" — even
      # though the runner's own `npm ci` a few steps earlier succeeded.
      #
      # Building here instead moves the install to the one machine that already
      # holds a working GH_NPM_TOKEN, and ships only the compiled output. Vercel
      # never talks to npm, so the npm credential never has to be copied into a
      # Vercel project env var and kept in sync in two places.
      #
      # Safe because every route in these apps is `ƒ (Dynamic) — server-rendered on
      # demand`, so no page is prerendered from a secret. That is NOT the same as
      # the build never loading the server env module: `next build` imports every
      # route module while it collects page data, and kriegerdataforge-auth-ui's env
      # module throws at load on a missing value (measured 2026-09-17, a build with
      # an empty KDF_SERVICE_KEY died at `Failed to collect page data for /login`).
      # An app whose env module fails fast must therefore skip its Sensitive rules
      # in the build phase (`NEXT_PHASE === "phase-production-build"`) and apply
      # them at server start, as the auth UI does (its D-004). The build needs no
      # runtime secret only under that condition. This matters because `vercel pull` below
      # CANNOT retrieve Sensitive env var values (Vercel makes them write-only), so
      # a build that did need one at build time would fail here while passing on
      # Vercel's remote builder. If a future app statically prerenders a page that
      # reads a sensitive var, that app must stay on the remote-build path.
      - name: Pull Vercel project settings and build env
        # Writes .vercel/project.json + .vercel/.env.production.local so the local
        # build sees the same NEXT_PUBLIC_* values the remote builder would inline.
        #
        # DO NOT keep a GH_NPM_TOKEN env var on the Vercel projects. It is useless
        # on this path, and actively harmful: whatever `vercel pull` writes for it
        # lands in .env.production.local and can shadow the real token exported into
        # the build step below — and a Sensitive var pulls back with no value, so it
        # would shadow it with an EMPTY string and resurrect the original 401.
        run: vercel pull --yes --environment=production --token "$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ steps.token.outputs.token }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      # `vercel pull` writes the project's own Node.js Version into
      # .vercel/project.json. On the old remote-build path that setting was resolved
      # by Vercel's builder and never had to agree with anything here, so it was free
      # to drift — projects sat on 24.x while every CI lane validated on 22. Building
      # locally makes it binding, and the CLI reports a mismatch as the opaque
      # "Found invalid Node.js Version", which names the setting but not the pipeline
      # it now has to agree with. Fail with the actual instruction instead.
      - name: Verify Vercel project Node version matches this runner
        run: |
          if [ ! -f .vercel/project.json ]; then
            echo "::error::.vercel/project.json missing — 'vercel pull' did not link the project."
            exit 1
          fi
          SETTING="$(node -p "((require('./.vercel/project.json').settings)||{}).nodeVersion||''")"
          RUNNER="$(node -p "process.versions.node.split('.')[0]")"
          if [ -z "$SETTING" ]; then
            echo "::warning::Vercel project declares no explicit Node.js Version — skipping match check."
            exit 0
          fi
          if [ "${SETTING%%.*}" != "$RUNNER" ]; then
            echo "::error::Node mismatch — Vercel project is set to '${SETTING}', this workflow builds on Node ${RUNNER}.x. The prebuilt artifact is compiled here, so the two must agree."
            echo "Fix ONE of:"
            echo "  (a) Vercel -> Project Settings -> Node.js Version -> ${RUNNER}.x"
            echo "      Recommended: every ci-nextjs-* lane already validates on ${RUNNER}.x,"
            echo "      so this aligns build, test and runtime on one version."
            echo "  (b) Raise node-version here AND the ci-nextjs-* node_version inputs to"
            echo "      match '${SETTING}', and pin a Vercel CLI new enough to accept it —"
            echo "      the pinned 58.5.1 supports 10/12/14/16/18/20/22/24.x only."
            exit 1
          fi
          echo "Node OK — Vercel project '${SETTING}' matches runner Node ${RUNNER}.x"

      # One install, the one `vercel build` runs itself from the pulled project settings
      # (auth UI register row 42, the standalone `npm ci` before it installed the same tree
      # twice). The build reads .vercel/ written by `vercel pull` and calls no Vercel API,
      # so it holds no deploy token. The first DEV deploy after this change is its proof.
      - name: Build
        env:
          # Private GH-Packages npm auth (reports-ecosystem epic W3.5): consumers that
          # depend on @needless2say/* commit an .npmrc interpolating ${GH_NPM_TOKEN} — a
          # CLASSIC read:packages PAT (GH Packages rejects fine-grained PATs and App
          # installation tokens). Always exported; empty for token-less consumers.
          GH_NPM_TOKEN: ${{ secrets.GH_NPM_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel build --prod

      # The freshness rule, immediately before the owner's one `--prod` call, which promotes as it deploys, inside the
      # group. The live target is read and this deploy refused when its start is before the live deployment's. A live
      # deployment with no stamp, a legacy one, lets the owner's deploy promote and says so in the summary.
      - name: Hold this deploy to the live deployment's start
        if: needs.authorize.outputs.path == 'human'
        uses: Needless2Say/kriegerdataforge-cicd/.github/actions/deploy-stamp@main
        with:
          command: fresh
          token: ${{ secrets.VERCEL_DEPLOYMENT_TOKEN }}
          org: ${{ secrets.VERCEL_ORG_ID }}
          project: ${{ secrets.VERCEL_PROJECT_ID }}
          started: ${{ steps.start.outputs.started }}
          path: human

      # The stamp, the release, its commit, the run and attempt and the job's start, rides on the deployment as its
      # metadata.
      - name: Deploy prebuilt artifact to Vercel
        if: needs.authorize.outputs.path == 'human'
        run: |
          vercel deploy --prebuilt --prod --yes --token "$VERCEL_TOKEN" \
            --meta "kdf_version=$STAMP_VERSION" \
            --meta "kdf_commit=$STAMP_COMMIT" \
            --meta "kdf_run_id=$GITHUB_RUN_ID" \
            --meta "kdf_run_attempt=$GITHUB_RUN_ATTEMPT" \
            --meta "kdf_started_at=$STAMP_STARTED"
        env:
          VERCEL_TOKEN: ${{ steps.token.outputs.token }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          STAMP_VERSION: ${{ inputs.version }}
          STAMP_COMMIT: ${{ needs.release.outputs.sha }}
          STAMP_STARTED: ${{ steps.start.outputs.started }}

      # ── A bot's redeploy, the Python deploy's shape ───────────────────────────
      # The same build, deployed without the domains so the release that is serving keeps serving, smoked on the
      # caller's route that loads the env module through the protection bypass, the live target read again, and
      # only then promoted. A failed smoke fails the run and nothing is promoted.
      - name: The bot's candidate, deployed without the domains
        id: candidate
        if: needs.authorize.outputs.path == 'bot'
        run: |
          # the CLI prints the deployment URL alone on stdout, its progress goes to stderr
          URL="$(vercel deploy --prebuilt --prod --yes --skip-domain --token "$VERCEL_TOKEN" \
            --meta "kdf_version=$STAMP_VERSION" \
            --meta "kdf_commit=$STAMP_COMMIT" \
            --meta "kdf_run_id=$GITHUB_RUN_ID" \
            --meta "kdf_run_attempt=$GITHUB_RUN_ATTEMPT" \
            --meta "kdf_started_at=$STAMP_STARTED" | tail -n 1)"
          case "$URL" in
            https://*) ;;
            *) echo "::error::vercel deploy printed no deployment URL (got '${URL}')"; exit 1 ;;
          esac
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "deployed, not yet promoted: $URL"
        env:
          VERCEL_TOKEN: ${{ steps.token.outputs.token }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          STAMP_VERSION: ${{ inputs.version }}
          STAMP_COMMIT: ${{ needs.release.outputs.sha }}
          STAMP_STARTED: ${{ steps.start.outputs.started }}

      - name: The bot's candidate, smoked on its route before it serves
        if: needs.authorize.outputs.path == 'bot'
        run: |
          set +e
          URL="${DEPLOY_URL}${SMOKE_PATH}"
          # the bypass value reaches curl as a header file, never as an argument a process listing reads
          BYPASS_HEADER="${RUNNER_TEMP}/bypass.header"
          trap 'rm -f "$BYPASS_HEADER"' EXIT
          if [ -n "$BYPASS" ]; then
            (umask 077 && printf 'x-vercel-protection-bypass: %s\n' "$BYPASS" > "$BYPASS_HEADER")
          fi
          code=""
          for attempt in 1 2 3 4 5 6; do
            if [ -n "$BYPASS" ]; then
              code="$(curl -s -o /dev/null -w '%{http_code}' -H "@$BYPASS_HEADER" "$URL")"
            else
              code="$(curl -s -o /dev/null -w '%{http_code}' "$URL")"
            fi
            if [ "$code" = "200" ]; then
              echo "the smoke route answered 200 on attempt ${attempt}"
              exit 0
            fi
            echo "attempt ${attempt}: the smoke route answered ${code:-nothing}"
            sleep 10
          done
          echo "::error::the bot's candidate does not answer its smoke route with 200, so it is not promoted"
          exit 1
        env:
          DEPLOY_URL: ${{ steps.candidate.outputs.url }}
          SMOKE_PATH: ${{ inputs.smoke_path }}
          BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

      - name: The bot's candidate, held to the live deployment's start
        if: needs.authorize.outputs.path == 'bot'
        uses: Needless2Say/kriegerdataforge-cicd/.github/actions/deploy-stamp@main
        with:
          command: fresh
          token: ${{ secrets.VERCEL_DEPLOYMENT_TOKEN }}
          org: ${{ secrets.VERCEL_ORG_ID }}
          project: ${{ secrets.VERCEL_PROJECT_ID }}
          started: ${{ steps.start.outputs.started }}
          path: bot

      - name: The bot's candidate, promoted to the production domains
        if: needs.authorize.outputs.path == 'bot'
        run: vercel promote "$DEPLOY_URL" --yes --token "$VERCEL_TOKEN"
        env:
          DEPLOY_URL: ${{ steps.candidate.outputs.url }}
          VERCEL_TOKEN: ${{ steps.token.outputs.token }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
