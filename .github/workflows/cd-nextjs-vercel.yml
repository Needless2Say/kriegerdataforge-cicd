# Reusable CD workflow — Next.js → Vercel
#
# Called by consumer repos to deploy a Next.js frontend to a Vercel project.
# The `environment` input controls which GitHub Environment is activated,
# which in turn:
#   1. Requires approval from the configured reviewers (prod: owner only,
#      dev: owner + collaborator)
#   2. Loads its secrets. A job with `environment:` reads repository AND environment
#      secrets together, so the shared token lives at REPOSITORY level (one value
#      everywhere) while the per-env values stay environment-scoped.
#
# Repository secrets (one global value — set at repo level, NOT per environment):
#   VERCEL_DEPLOYMENT_TOKEN — shared Vercel deploy/management token
#   GH_NPM_TOKEN            — CLASSIC read:packages PAT for the private
#                             @needless2say/* GitHub Packages scope. Required by
#                             any consumer whose package.json depends on it; the
#                             build happens HERE (see the prebuilt note below), so
#                             this Actions secret is the ONLY place it is needed —
#                             the Vercel projects do not carry an npm credential.
# Environment secrets (set per environment in the caller repo):
#   VERCEL_ORG_ID      — Vercel team / org ID
#   VERCEL_PROJECT_ID  — Vercel project ID for the target environment
#
# Usage (consumer repo .github/workflows/cd.yml):
#   jobs:
#     deploy:
#       uses: Needless2Say/kriegerdataforge-cicd/.github/workflows/cd-nextjs-vercel.yml@main
#       with:
#         environment: ${{ inputs.environment }}
#         version: ${{ inputs.version }}
#       secrets: inherit

name: CD — Next.js → Vercel (reusable)

on:
  workflow_call:
    inputs:
      environment:
        description: 'Target GitHub Environment ("dev" or "prod")'
        required: true
        type: string
      version:
        description: 'Version to deploy (e.g. 1.2.0). Specify an older version to roll back.'
        required: true
        type: string

jobs:
  # ── Deployer authorization gate ───────────────────────────────────────────
  # Runs BEFORE the deploy job, and BEFORE the GitHub Environment approval is
  # requested. Verifies the user who dispatched this run is an approved deployer
  # for this repo + environment, per the central allow-list in
  # kriegerdataforge-cicd (scripts/deployer_registry.json). Fails closed.
  authorize:
    name: Authorize deployer
    runs-on: ubuntu-slim
    permissions:
      contents: read
    steps:
      - name: Check out deployer registry (kriegerdataforge-cicd)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: Needless2Say/kriegerdataforge-cicd
          ref: main
          sparse-checkout: scripts
          path: _kdf_cicd
          # The cicd repo is public, so the caller's default github.token can read it.
          # (If cicd ever goes private, this checkout needs a read-only token with access
          # to it — see KDF docs/engineering/GITHUB_FUTURE_ENHANCEMENTS.md.)
          token: ${{ github.token }}

      - name: Verify deployer is approved
        run: python3 _kdf_cicd/scripts/check_deployer.py
        env:
          DEPLOY_REPO: ${{ github.repository }}
          DEPLOY_ACTOR: ${{ github.triggering_actor }}
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}

  deploy:
    name: Deploy (${{ inputs.environment }})
    needs: authorize
    runs-on: ubuntu-slim

    # Activates the GitHub Environment gate for the caller repo:
    # - Pauses for required reviewer approval
    # - Loads environment-scoped secrets into this job
    environment: ${{ inputs.environment }}

    permissions:
      contents: read
      id-token: write  # Required for Vercel OIDC

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: v${{ inputs.version }}

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Validate Vercel project binding
        run: |
          if [ -z "${VERCEL_PROJECT_ID:-}" ]; then
            echo "❌  VERCEL_PROJECT_ID is not set in the GitHub Environment."
            echo "    Without it the Vercel CLI falls back to org-wide project discovery"
            echo "    and may deploy to the wrong project or trigger other projects."
            echo "    Set VERCEL_PROJECT_ID in the '${{ inputs.environment }}' environment"
            echo "    secrets for this repo and re-run."
            exit 1
          fi
          echo "✅  Deploying to Vercel project: $VERCEL_PROJECT_ID"
        env:
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Install Vercel CLI
        # Pin the Vercel CLI to an exact version instead of `npx vercel`, which
        # resolves "latest" from the registry at deploy time. This job holds
        # VERCEL_DEPLOYMENT_TOKEN, so floating the CLI is a poisoned-pipeline /
        # dependency-chain risk (CICD-SEC-3 / SLSA). Bump via Dependabot.
        run: npm install -g vercel@48.0.0

      - name: Prepare Vercel token
        # A VERCEL_DEPLOYMENT_TOKEN env secret pasted by hand often carries a trailing newline/space, which
        # the Vercel CLI rejects ("The specified token is not valid") even though the token itself is valid.
        # Trim once here and reuse across the pull/build/deploy steps below. The TRIMMED value is a different
        # string from the raw secret, so GitHub's automatic masking does not cover it — ::add-mask:: is what
        # keeps it out of the logs. (Only the LENGTH is echoed, for debugging.)
        run: |
          TOKEN="$(printf '%s' "$VERCEL_DEPLOYMENT_TOKEN" | tr -d '[:space:]')"
          if [ -z "$TOKEN" ]; then
            echo "::error::VERCEL_DEPLOYMENT_TOKEN is empty in the '${{ inputs.environment }}' environment — set the VERCEL_DEPLOYMENT_TOKEN environment secret on this repo (correct environment)."
            exit 1
          fi
          echo "::add-mask::$TOKEN"
          echo "VERCEL_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          echo "VERCEL_DEPLOYMENT_TOKEN trimmed length=${#TOKEN}"
        env:
          VERCEL_DEPLOYMENT_TOKEN: ${{ secrets.VERCEL_DEPLOYMENT_TOKEN }}

      # ── Why this deploys a PREBUILT artifact ──────────────────────────────────
      # A plain `vercel --prod` uploads SOURCE and builds on Vercel's machine. That
      # remote builder cannot see any GitHub Actions secret, so `npm install` there
      # has no credential for the private @needless2say/* GitHub Packages scope and
      # dies with "401 … cannot be authenticated with the token provided" — even
      # though the runner's own `npm ci` a few steps earlier succeeded.
      #
      # Building here instead moves the install to the one machine that already
      # holds a working GH_NPM_TOKEN, and ships only the compiled output. Vercel
      # never talks to npm, so the npm credential never has to be copied into a
      # Vercel project env var and kept in sync in two places.
      #
      # Safe because every route in these apps is `ƒ (Dynamic) — server-rendered on
      # demand`: `next build` never evaluates the server env module, so the build
      # needs no runtime secret. Verified by building all three apps with every
      # sensitive var unset — all exit 0. This matters because `vercel pull` below
      # CANNOT retrieve Sensitive env var values (Vercel makes them write-only), so
      # a build that did need one at build time would fail here while passing on
      # Vercel's remote builder. If a future app statically prerenders a page that
      # reads a sensitive var, that app must stay on the remote-build path.
      - name: Pull Vercel project settings and build env
        # Writes .vercel/project.json + .vercel/.env.production.local so the local
        # build sees the same NEXT_PUBLIC_* values the remote builder would inline.
        #
        # DO NOT keep a GH_NPM_TOKEN env var on the Vercel projects. It is useless
        # on this path, and actively harmful: whatever `vercel pull` writes for it
        # lands in .env.production.local and can shadow the real token exported into
        # the build step below — and a Sensitive var pulls back with no value, so it
        # would shadow it with an EMPTY string and resurrect the original 401.
        run: vercel pull --yes --environment=production --token "$VERCEL_TOKEN"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Install dependencies
        env:
          # Private GH-Packages npm auth (reports-ecosystem epic W3.5): consumers that
          # depend on @needless2say/* commit an .npmrc interpolating ${GH_NPM_TOKEN} — a
          # CLASSIC read:packages PAT (GH Packages rejects fine-grained PATs and App
          # installation tokens). Always exported; empty for token-less consumers.
          GH_NPM_TOKEN: ${{ secrets.GH_NPM_TOKEN }}
        run: npm ci

      - name: Build
        env:
          # `vercel build` re-runs the project's install command, so the npm scope
          # credential must be present for this step too — not just the `npm ci` above.
          GH_NPM_TOKEN: ${{ secrets.GH_NPM_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel build --prod --token "$VERCEL_TOKEN"

      - name: Deploy prebuilt artifact to Vercel
        run: vercel deploy --prebuilt --prod --yes --token "$VERCEL_TOKEN"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
