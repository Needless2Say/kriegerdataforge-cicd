name: Python · Lint (ruff)

# N3b: least-privilege — read-only reusable lint lane (cap the GITHUB_TOKEN).
permissions:
  contents: read

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to check out (tag, branch or SHA). Empty checks out the caller run's own ref, a release dispatch passes the release tag so this lane judges the exact commit being deployed.
        type: string
        default: ""
      python_version:
        description: Python version to use
        type: string
        default: "3.14"
      install_command:
        description: Command to install dependencies before linting
        type: string
        default: "pip install -r requirements.txt"
      lint_command:
        description: Full ruff check command to run
        type: string
        default: "python -m ruff check ."
      needs_sdk_auth:
        description: Fetch the owner's private packages in a separate job that holds the token (the App's installation token when the caller sets USE_GITHUB_APP, else the GH_PACKAGES_PAT secret), and install and test in a job that names no secret (D-035)
        type: boolean
        default: false
      requirement_files:
        description: The caller's requirement files the fetch reads for git+https pins of the owner's private repos, space separated, a missing one skipped
        type: string
        default: "requirements.txt requirements.in requirements-dev.txt requirements-dev.in requirements-test.txt requirements-test.in pyproject.toml"
      extra_repos:
        description: More repos to mirror, repo@ref items, a branch allowed here alone and resolved to its commit
        type: string
        default: ""
      scan_files:
        description: Requirement files read inside a mirrored extra repo at its commit, repo:path items
        type: string
        default: ""
      token_repositories:
        description: The repos the App token is minted for, the narrower fence per call. Empty is every repo the fetch clones
        type: string
        default: ""

jobs:
  # D-035. The one job of this workflow that names a secret. It runs git and this workflow's own text, nothing of the
  #   caller's. It reads the requirement files as text, clones what they pin from the owner's private repos into bare
  #   mirrors and hands them on as an artifact, so the job that installs and tests names no secret at all and a process
  #   that becomes root there reads none out of the runner's memory. Written by scripts/render_fetch_job.py, every copy
  #   of it identical, edit the template there and run it.
  fetch-private:
    name: Fetch private packages
    if: ${{ inputs.needs_sdk_auth }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      artifact: ${{ steps.pack.outputs.artifact }}
      token_sha256: ${{ steps.fetch.outputs.token_sha256 }}

    steps:
      # the caller's tree is read as text and nothing of it runs, and no credential is left in its git config
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
          path: caller

      - name: Write the fetch script
        run: |
          mkdir -p "$RUNNER_TEMP/kdf-fetch"
          cat > "$RUNNER_TEMP/kdf-fetch/fetch_private_packages.py" <<'KDF_FETCH_PRIVATE_PACKAGES'
          """
          Fetch the owner's private repos a lane needs, as bare git mirrors, in the one job that holds a secret (D-035).

          The reusable Python lanes run code they do not trust, a test suite, an install's build hooks, a pull request's own
          tree, in a job that names no secret at all. A process that becomes root on a hosted runner reads the runner's own
          memory, where every secret its job names sits, so only a job that names none is out of reach. This script is the other
          half, the fetch job. It holds the token and runs nothing but git. It reads requirement files as text and never runs
          them, clones what they pin from the owner's private repos into bare mirrors, and the job hands the mirrors to the
          job that installs and tests, where git reads them through a rewrite of the https URL to the mirror on disk.

          Two commands.

            plan   Reads the caller's requirement files and the extra repos the caller names, checks every repo against the
                   allowlist and the public caller rule, and writes the plan and the repositories the token is minted for.
            fetch  Clones each extra repo at its ref, reads the requirement files the caller names inside those mirrors with
                   git show, then fetches every pinned ref into one bare mirror per repo and writes manifest.json beside them.

          What the scan reads. A pin is `git+https://github.com/Needless2Say/<repo>.git@<ref>`, an optional `#subdirectory=`
          or other fragment after it is part of the URL. A comment is a `#` at the start of a line or after whitespace, as pip
          reads one. A line ending in a backslash continues on the next. An include, `-r`, `-c`, `--requirement` or
          `--constraint`, is followed within the same tree, the caller's checkout or the same mirror at the same commit, and an
          include that names a URL or leaves the tree is refused, as is a file of the tree that is a link to a place outside it.
          Any other reference to the owner's repos that pip could install fails the plan, a git+, git@ or ssh:// URL, an
          archive or wheel link, or a pip option line, so the caller learns early that the scan does not read it. A plain https
          link to a repo's page, as a pyproject's [project.urls] table holds, is not one pip installs and passes. Either way the
          rule is not the fence, a pin the scan misses fails closed in the install job, which has no mirror and no token for it.
          A ref read out of a
          requirement file is a tag or a full commit id, never a branch. A branch is allowed only for a repo the caller lists by
          name as an extra repo, and is resolved to the commit it points at, which the manifest records. The house formatter's
          repo is the one exception (D-054). Every repo's requirements-dev.in names kdf-fmt at main with no lock beside it, so
          its branch is resolved once to the commit it points at and fetched as an extra repo's is, the mirror's branch set to
          that commit, so a move of the branch after the fetch changes nothing a lane installs. One branch is let through
          without being fetched. A branch written only in `.in` files, where the owner names a private package at
          `main` (D-051), is left to the lock compiled from each, the `.txt` file of the same name beside it, when that lock
          pins the same repo by a full commit id. The fetch takes the lock's commit, which every lane installs, and never the
          branch. A requirement file's name holds no colon, since a mirror's files are named `repo:path`.

          The workflows run this file's own text, written into the fetch job by `render_fetch_job.py` (a test holds every copy
          to this file), with the runner's `/usr/bin/python3` in isolated mode. Standard library only, Python 3.12 or later.
          """

          from __future__ import annotations

          # standard imports
          import argparse
          import hashlib
          import json
          import os
          import posixpath
          import re
          import subprocess
          import sys
          import urllib.request
          from dataclasses import dataclass, field
          from pathlib import Path
          from typing import Callable

          # ======================================================================================================================
          # Configuration
          # ======================================================================================================================

          OWNER = "Needless2Say"

          # every repo of the owner a lane may mirror, and whether it is public. A public calling repo may mirror only a public
          # one, its run artifacts are readable by anyone, so a public repo has no private package to fetch
          ALLOWLIST: dict[str, str] = {
              "kriegerdataforge-sdk": "private",
              "kriegerdataforge-reports-sdk": "private",
              "kriegerdataforge-fmt": "private",
              "kriegerdataforge": "private",
              "fitness-app-backend": "private",
              "tiffanys-space-backend": "private",
              # the public stand in that lets this repo's own CI prove the path without publishing private code
              "kriegerdataforge-cicd": "public",
          }

          # the house formatter's repo, the one repo a requirement file may name at a branch, since every repo declares kdf-fmt
          # at main in requirements-dev.in with no lock beside it (D-054)
          FORMATTER = "kriegerdataforge-fmt"

          PIN = re.compile(r"git\+https://github\.com/Needless2Say/(?P<repo>[A-Za-z0-9._-]+?)\.git@(?P<ref>[^\s#;,'\"\[\]]+)")
          MENTION    = re.compile(r"github\.com[:/]+needless2say/", re.IGNORECASE)
          INCLUDE    = re.compile(r"^(?:-r|-c|--requirement|--constraint)(?:\s*=\s*|\s+|(?=[^\s=-]))(?P<path>\S+)$")
          COMMENT    = re.compile(r"(?:^|\s)#.*$")
          FULL_SHA   = re.compile(r"[0-9a-f]{40}")
          REF_TEXT   = re.compile(r"[A-Za-z0-9][A-Za-z0-9._/+-]*")
          CREDENTIAL = re.compile(r"(https?://)[^/\s@]+@")

          # one URL or word of a line, what lies between quotes, brackets, separators and whitespace
          TOKEN = re.compile(r"[^\s'\"<>()\[\]{},;]+")

          # a token pip could install from, a VCS URL, an archive or a wheel
          INSTALLABLE_FORMS = (
              r"git\+",
              r"git@",
              r"ssh://",
              r"codeload\.github\.com",
              r"/archive/",
              r"/tarball/",
              r"/zipball/",
              r"\.zip(?:$|[?#])",
              r"\.tar\.gz(?:$|[?#])",
              r"\.whl(?:$|[?#])",
          )
          INSTALLABLE       = re.compile("|".join(INSTALLABLE_FORMS), re.IGNORECASE)

          MAX_INCLUDE_DEPTH = 10

          # git's automatic maintenance off for every call, and anything that would still run kept in the foreground (D-045)
          NO_MAINTENANCE = (
              "-c",
              "gc.auto=0",
              "-c",
              "gc.autoDetach=false",
              "-c",
              "maintenance.auto=false",
              "-c",
              "maintenance.autoDetach=false",
          )

          Reader = Callable[[str], "str | None"]


          class FetchError(Exception):
              """
              A refusal. The message names what was refused and why, never a token or a URL that carries one.
              """

          # ======================================================================================================================
          # Reading requirement files as text
          # ======================================================================================================================

          @dataclass
          class Pin:
              """
              One ref of one repo, and every place that asked for it.
              """
              repo:    str
              ref:     str
              sources: list[str] = field(default_factory = list)


          def logical_lines(text: str) -> list[str]:
              """
              The lines pip reads, a line ending in a backslash joined to the next.

              Args:
                  text: a requirement file's text

              Returns:
                  list[str]: the logical lines, in order
              """
              lines: list[str] = []
              carried = ""
              for raw in text.splitlines():
                  if raw.endswith("\\"):
                      carried += raw[:-1] + " "
                      continue
                  lines.append(carried + raw)
                  carried = ""
              if carried:
                  lines.append(carried)
              return lines


          def strip_comment(line: str) -> str:
              """
              The line without its comment, a `#` at the start or after whitespace. A `#` inside a URL is its fragment.

              Args:
                  line: one logical line

              Returns:
                  str: the line with its comment removed and its ends stripped
              """
              return COMMENT.sub("", line).strip()


          def scan_text(text: str, source: str) -> tuple[list[tuple[str, str]], list[str]]:
              """
              The pins and the include paths of one file's text.

              Args:
                  text: the file's text
                  source: the file's name, for a refusal's message

              Returns:
                  tuple[list[tuple[str, str]], list[str]]: the (repo, ref) pins in order, and the include paths

              Raises:
                  FetchError: when a line holds a reference to the owner's repos that pip could install and the scan does not
                      read, a git+, git@ or ssh:// URL, an archive or wheel link, or any mention on a pip option line
              """
              pins:     list[tuple[str, str]] = []
              includes: list[str] = []
              for line in logical_lines(text):
                  stripped = strip_comment(line)
                  if not stripped:
                      continue
                  include = INCLUDE.match(stripped)
                  if include:
                      includes.append(include.group("path"))
                  option = stripped.startswith("-")
                  for token in TOKEN.findall(stripped):
                      mentions = len(MENTION.findall(token))
                      if mentions > len(PIN.findall(token)) and (option or INSTALLABLE.search(token)):
                          raise FetchError(
                              f"{source}: a reference to {OWNER}'s repos in a form this lane does not read, write it "
                              f"git+https://github.com/{OWNER}/<repo>.git@<tag or full commit id>"
                          )
                  pins.extend((match.group("repo"), match.group("ref")) for match in PIN.finditer(stripped))
              return pins, includes


          def include_target(current: str, path: str, source: str) -> str:
              """
              The tree relative path an include names.

              Args:
                  current: the tree relative path of the file that holds the include
                  path: the path the include names
                  source: the including file, for a refusal's message

              Returns:
                  str: the normalised tree relative path

              Raises:
                  FetchError: when the include is a URL, an absolute path, or leaves the tree
              """
              if "://" in path or path.startswith(("/", "\\")) or re.match(r"[A-Za-z]:", path):
                  raise FetchError(f"{source}: the include {path} is not a path inside the same tree")
              target = posixpath.normpath(posixpath.join(posixpath.dirname(current), path.replace("\\", "/")))
              if target == ".." or target.startswith("../"):
                  raise FetchError(f"{source}: the include {path} leaves the tree")
              return target


          def scan_tree(read: Reader, files: list[str], label: str, required: bool) -> list[Pin]:
              """
              Every pin in the named files of one tree, following includes within it.

              A named file that does not exist is skipped when the list is a default, and refused when the caller named it
              (required). An include that does not exist is always refused.

              Args:
                  read: reads a tree relative file as text, None when it is not there
                  files: the tree relative files to read
                  label: a prefix for each source, the repo for a mirror, empty for the caller
                  required: whether a named file that is not there is refused

              Returns:
                  list[Pin]: each repo and ref once, with every file that pins it

              Raises:
                  FetchError: on a missing required file or include, includes nested too deep, or a refusal of scan_text
              """
              pins:  dict[tuple[str, str], Pin] = {}
              seen:  set[str] = set()
              stack: list[tuple[str, int, bool]] = [(posixpath.normpath(name), 0, required) for name in reversed(files)]
              while stack:
                  name, depth, must_exist = stack.pop()
                  if name in seen:
                      continue
                  seen.add(name)
                  source = f"{label}{name}"
                  if ":" in name:
                      # a mirror's files are named repo:path, so a caller's file with a colon could pass for one (D-051)
                      raise FetchError(f"{source}: a requirement file's name holds no colon, which marks a mirror's files")
                  text = read(name)
                  if text is None:
                      if must_exist:
                          raise FetchError(f"{source}: no such file")
                      print(f"  {source} is not there, skipped")
                      continue
                  found, includes = scan_text(text, source)
                  for repo, ref in found:
                      pins.setdefault((repo, ref), Pin(repo, ref)).sources.append(source)
                  if includes and depth >= MAX_INCLUDE_DEPTH:
                      raise FetchError(f"{source}: includes nest deeper than {MAX_INCLUDE_DEPTH}")
                  for path in reversed(includes):
                      stack.append((include_target(name, path, source), depth + 1, True))
              return list(pins.values())


          def directory_reader(root: Path) -> Reader:
              """
              A reader of one checkout's files, which follows a link only to a place inside the checkout.

              Args:
                  root: the checkout's folder

              Returns:
                  Reader: reads a tree relative file as text, None when it is not a file
              """
              inside = root.resolve()


              def read(name: str) -> str | None:
                  """
                  One file of the checkout, the path resolved through every link first.

                  Args:
                      name: the tree relative path

                  Returns:
                      str | None: the text, None when it is not a file

                  Raises:
                      FetchError: when the path, through a link, leads out of the checkout
                  """
                  path = (root / name).resolve()
                  if path != inside and inside not in path.parents:
                      raise FetchError(f"{name}: a link that leads out of the tree")
                  return path.read_text(encoding = "utf-8", errors = "replace") if path.is_file() else None


              return read

          # ======================================================================================================================
          # Rules every repo and ref meets
          # ======================================================================================================================

          def check_repo(repo: str, caller_private: bool, source: str) -> None:
              """
              The repo is on the allowlist, and a public caller mirrors only a public one.

              Args:
                  repo: the repo's name under the owner
                  caller_private: whether the calling repo is private
                  source: where the repo was named, for a refusal's message

              Raises:
                  FetchError: when the repo is off the allowlist, or private while the caller is public
              """
              if repo not in ALLOWLIST:
                  raise FetchError(f"{source}: {OWNER}/{repo} is not on the allowlist of repos a lane may mirror")
              if not caller_private and ALLOWLIST[repo] != "public":
                  raise FetchError(
                      f"{source}: {OWNER}/{repo} is private and the calling repo is public. Its run artifacts are readable by "
                      "anyone, so a public repo has no private package to fetch"
                  )


          def check_ref_text(ref: str, source: str) -> None:
              """
              A ref is a full commit id or a plain name, no option, no range and no reflog syntax.

              Args:
                  ref: the ref as written
                  source: where it was written, for a refusal's message

              Raises:
                  FetchError: when the ref is not one this lane reads
              """
              if FULL_SHA.fullmatch(ref):
                  return
              if not REF_TEXT.fullmatch(ref) or ".." in ref or ref.endswith((".lock", "/", ".")):
                  raise FetchError(f"{source}: {ref!r} is not a ref this lane reads")


          def parse_extras(text: str) -> list[tuple[str, str]]:
              """
              The extra repos, `repo@ref` items split by whitespace or commas.

              Args:
                  text: the extra_repos input

              Returns:
                  list[tuple[str, str]]: (repo, ref) in order

              Raises:
                  FetchError: when an item is not repo@ref
              """
              extras: list[tuple[str, str]] = []
              for item in re.split(r"[\s,]+", text.strip()):
                  if not item:
                      continue
                  repo, separator, ref = item.partition("@")
                  if not separator or not repo or not ref:
                      raise FetchError(f"extra_repos: {item!r} is not repo@ref")
                  extras.append((repo, ref))
              return extras


          def parse_scan_files(text: str) -> list[tuple[str, str]]:
              """
              The files to read inside a mirror, `repo:path` items split by whitespace or commas.

              Args:
                  text: the scan_files input

              Returns:
                  list[tuple[str, str]]: (repo, path) in order

              Raises:
                  FetchError: when an item is not repo:path
              """
              targets: list[tuple[str, str]] = []
              for item in re.split(r"[\s,]+", text.strip()):
                  if not item:
                      continue
                  repo, colon, path = item.partition(":")
                  if not colon or not repo or not path:
                      raise FetchError(f"scan_files: {item!r} is not repo:path")
                  targets.append((repo, path))
              return targets


          def parse_list(text: str) -> list[str]:
              """
              A list of names split by whitespace or commas.

              Args:
                  text: the input

              Returns:
                  list[str]: the names, empty items dropped
              """
              return [item for item in re.split(r"[\s,]+", text.strip()) if item]

          # ======================================================================================================================
          # plan
          # ======================================================================================================================

          def caller_is_private(event_value: str, repository: str, token: str, api_url: str) -> bool:
              """
              Whether the calling repo is private. Unknown is public, which fails closed.

              The event says so on every event that carries the repo, and a run whose event does not (a schedule) asks the API
              with the run's own read token.

              Args:
                  event_value: github.event.repository.private as text, empty when the event has no repo
                  repository: owner/repo of the calling run
                  token: the run's own GITHUB_TOKEN
                  api_url: the API's base URL

              Returns:
                  bool: True only when the repo is known to be private
              """
              if event_value in ("true", "false"):
                  return event_value == "true"
              if not repository or not token:
                  return False
              request = urllib.request.Request(
                  f"{api_url or 'https://api.github.com'}/repos/{repository}",
                  headers = {"Authorization": f"Bearer {token}", "Accept": "application/vnd.github+json"},
              )
              try:
                  with urllib.request.urlopen(request, timeout = 20) as response:
                      return json.loads(response.read().decode("utf-8")).get("private") is True
              except (OSError, ValueError):
                  return False


          def plan(caller: Path, env: dict[str, str]) -> dict:
              """
              What the fetch will clone and the repositories its token covers, every repo and ref checked first.

              Args:
                  caller: the caller's checkout
                  env: the step's environment, the inputs as REQUIREMENT_FILES, EXTRA_REPOS, SCAN_FILES and
                      TOKEN_REPOSITORIES, and CALLER_PRIVATE, GITHUB_REPOSITORY, GITHUB_TOKEN and GITHUB_API_URL

              Returns:
                  dict: caller_private, pins, extras, scan and repositories, as the fetch command reads them

              Raises:
                  FetchError: on any refusal of the scan or the rules
              """
              caller_private = caller_is_private(
                  env.get("CALLER_PRIVATE", ""),
                  env.get("GITHUB_REPOSITORY", ""),
                  env.get("GITHUB_TOKEN", ""),
                  env.get("GITHUB_API_URL", ""),
              )
              print(f"the calling repo is {'private' if caller_private else 'public'}")
              files = parse_list(env.get("REQUIREMENT_FILES", ""))
              pins  = scan_tree(directory_reader(caller), files, "", required = False)
              for pin in pins:
                  check_repo(pin.repo, caller_private, pin.sources[0])
                  check_ref_text(pin.ref, pin.sources[0])
              extras = parse_extras(env.get("EXTRA_REPOS", ""))
              for repo, ref in extras:
                  check_repo(repo, caller_private, "extra_repos")
                  check_ref_text(ref, "extra_repos")
              scan = parse_scan_files(env.get("SCAN_FILES", ""))
              for repo, _path in scan:
                  if repo not in {name for name, _ref in extras}:
                      raise FetchError(f"scan_files: {repo} is read inside its mirror, so name it in extra_repos too")
              asked = parse_list(env.get("TOKEN_REPOSITORIES", ""))
              for repo in asked:
                  check_repo(repo, caller_private, "token_repositories")
              needed = sorted({pin.repo for pin in pins} | {repo for repo, _ref in extras})
              if asked:
                  missing = [repo for repo in needed if repo not in asked]
                  if missing:
                      raise FetchError(f"token_repositories leaves out {', '.join(missing)}, which the fetch clones")
              repositories = sorted(set(asked)) if asked else needed
              for pin in pins:
                  print(f"  pin {pin.repo}@{pin.ref} from {', '.join(pin.sources)}")
              for repo, ref in extras:
                  print(f"  extra {repo}@{ref}")
              return {
                  "caller_private": caller_private,
                  "pins": [{"repo": pin.repo, "ref": pin.ref, "sources": pin.sources} for pin in pins],
                  "extras": [{"repo": repo, "ref": ref} for repo, ref in extras],
                  "scan": [{"repo": repo, "path": path} for repo, path in scan],
                  "repositories": repositories,
              }

          # ======================================================================================================================
          # fetch
          # ======================================================================================================================

          def redact(text: str) -> str:
              """
              Text with the user part of every URL removed, so a git error never prints a token.

              Args:
                  text: git's error text

              Returns:
                  str: the text with each URL's user part replaced
              """
              return CREDENTIAL.sub(r"\1***@", text)


          def run_git(args: list[str]) -> str:
              """
              Run git with no hook, no credential helper and no automatic maintenance.

              A fetch ends by starting git's automatic maintenance, a gc that detaches and keeps writing the mirror's
              objects/pack after the fetch returns, so the step that packs the mirrors read a folder that was still changing
              and tar failed (D-045). Every call turns it off, and nothing that would run detaches.

              Args:
                  args: git's arguments

              Returns:
                  str: git's stdout

              Raises:
                  FetchError: when git fails, with git's error redacted
              """
              done = subprocess.run(
                  ["git", "-c", "core.hooksPath=/dev/null", "-c", "credential.helper=", *NO_MAINTENANCE, *args],
                  capture_output = True,
                  text = True,
                  check = False,
              )
              if done.returncode != 0:
                  verb = args[2] if args[0] == "--git-dir" else args[0]
                  raise FetchError(f"git {verb} failed: {redact(done.stderr.strip())}")
              return done.stdout


          def repo_url(repo: str) -> str:
              """
              The https URL of one of the owner's repos. The step's GIT_CONFIG rewrite adds the token, the URL never holds it.

              Args:
                  repo: the repo's name under the owner

              Returns:
                  str: the URL
              """
              return f"https://github.com/{OWNER}/{repo}.git"


          def parse_ls_remote(text: str) -> dict[str, str]:
              """
              Ref name to commit id, an annotated tag's peeled id under its `^{}` name.

              Args:
                  text: git ls-remote's output

              Returns:
                  dict[str, str]: each ref name with its id
              """
              refs: dict[str, str] = {}
              for line in text.splitlines():
                  sha, _, name = line.partition("\t")
                  if sha and name:
                      refs[name.strip()] = sha.strip()
              return refs


          def classify(
              repo: str,
              ref: str,
              refs: dict[str, str],
              allow_branch: bool,
              source: str,
              defer_branch: bool = False,
          ) -> tuple[str, str]:
              """
              The kind of a ref and the commit it names.

              Args:
                  repo: the repo's name under the owner
                  ref: the ref as written
                  refs: the repo's refs from ls-remote
                  allow_branch: whether a branch is allowed, only for a repo the caller lists by name, or the house formatter's
                  source: where the ref was written, for a refusal's message
                  defer_branch: whether a branch that is not allowed is left to the lock beside the files that name it, as
                      lock_covers says, rather than refused

              Returns:
                  tuple[str, str]: the kind, tag, sha, branch or deferred, and the commit id, a deferred branch's never fetched

              Raises:
                  FetchError: on a branch where none is allowed or deferred, a name that is both a tag and a branch, or no such
                      ref
              """
              if FULL_SHA.fullmatch(ref):
                  return "sha", ref
              tag  = refs.get(f"refs/tags/{ref}^{{}}") or refs.get(f"refs/tags/{ref}")
              head = refs.get(f"refs/heads/{ref}")
              if tag and head:
                  raise FetchError(f"{source}: {repo}@{ref} names both a tag and a branch, pin the commit id")
              if tag:
                  return "tag", tag
              if head:
                  if allow_branch:
                      return "branch", head
                  if defer_branch:
                      return "deferred", head
                  raise FetchError(f"{source}: {repo}@{ref} is a branch, pin a tag or a full commit id")
              raise FetchError(f"{source}: {repo}@{ref} names no tag or branch of {repo}")


          def lock_covers(repo: str, ref: str, sources: list[str], pins: dict[tuple[str, str], list[str]]) -> bool:
              """
              Whether every file that pins a repo at a ref is a `.in` file whose lock, the `.txt` file of the same name beside
              it, pins the same repo by a full commit id, so the lock's commit stands for the ref (D-051).

              Args:
                  repo: the repo's name under the owner
                  ref: the ref as written
                  sources: every file that pins the repo at the ref, a mirror's files carrying its `repo:` prefix
                  pins: every pin of the plan, by repo and ref, with the files that wrote it

              Returns:
                  bool: True when each source is a `.in` file whose lock pins the repo by a full commit id
              """
              if FULL_SHA.fullmatch(ref) or not sources:
                  return False
              locked = {
                  source
                  for (pin_repo, pin_ref), pin_sources in pins.items()
                  if pin_repo == repo and FULL_SHA.fullmatch(pin_ref)
                  for source in pin_sources
              }
              return all(source.endswith(".in") and f"{source[:-3]}.txt" in locked for source in sources)


          @dataclass
          class Mirrors:
              """
              One bare mirror per repo under dest/mirrors, and what was fetched into each.
              """
              dest:    Path
              git:     Callable[[list[str]], str] = run_git
              remotes: dict[str, dict[str, str]] = field(default_factory = dict)
              entries: list[dict] = field(default_factory = list)


              def path(self, repo: str) -> Path:
                  """
                  A repo's mirror.

                  Args:
                      repo: the repo's name under the owner

                  Returns:
                      Path: dest/mirrors/<repo>.git
                  """
                  return self.dest / "mirrors" / f"{repo}.git"


              def refs(self, repo: str) -> dict[str, str]:
                  """
                  A repo's refs, read once with ls-remote.

                  Args:
                      repo: the repo's name under the owner

                  Returns:
                      dict[str, str]: each ref name with its id
                  """
                  if repo not in self.remotes:
                      self.remotes[repo] = parse_ls_remote(self.git(["ls-remote", "--tags", "--heads", repo_url(repo)]))
                  return self.remotes[repo]


              def fetch(self, repo: str, wanted: list[dict]) -> None:
                  """
                  Fetch every wanted ref of one repo into its bare mirror in one fetch. The mirror has no working tree, so no
                  hook and no filter runs.

                  Each ref comes with its full history, since pip clones with a filter and a filtered clone of a shallow mirror
                  fails (measured). Each commit also gets a branch of its own, and the mirror's HEAD names the first. One fetch a
                  repo, with automatic maintenance off, leaves nothing writing the mirror once it returns (D-045).

                  Args:
                      repo: the repo's name under the owner
                      wanted: each ref as written with its kind (tag, sha or branch), its commit and every place that asked
                  """
                  mirror = self.path(repo)
                  refspecs: list[str] = []
                  for item in wanted:
                      ref, kind, sha = item["ref"], item["kind"], item["sha"]
                      refspecs.append(f"{sha}:refs/heads/kdf-pin-{sha[:12]}")
                      if kind == "tag":
                          refspecs.append(f"+refs/tags/{ref}:refs/tags/{ref}")
                      if kind == "branch":
                          refspecs.append(f"{sha}:refs/heads/{ref}")
                  if not mirror.exists():
                      mirror.parent.mkdir(parents = True, exist_ok = True)
                      first = wanted[0]["sha"]
                      self.git(["init", "--quiet", "--bare", f"--initial-branch=kdf-pin-{first[:12]}", str(mirror)])
                  self.git([
                      "--git-dir",
                      str(mirror),
                      "fetch",
                      "--quiet",
                      "--no-tags",
                      "--no-auto-maintenance",
                      repo_url(repo),
                      *dict.fromkeys(refspecs),
                  ])
                  for item in wanted:
                      ref, kind, sha = item["ref"], item["kind"], item["sha"]
                      self.git(["--git-dir", str(mirror), "rev-parse", "--verify", "--quiet", f"{sha}^{{commit}}"])
                      self.entries.append({"repo": repo, "ref": ref, "kind": kind, "sha": sha, "sources": item["sources"]})
                      print(f"  {repo}@{ref} ({kind}) at {sha}")


              def reader(self, repo: str, sha: str) -> Reader:
                  """
                  A reader of a mirror's files at one commit, with git show and no checkout.

                  Args:
                      repo: the repo's name under the owner
                      sha: the commit to read

                  Returns:
                      Reader: reads a tree relative file as text, None when the commit has no such file
                  """
                  def read(name: str) -> str | None:
                      """
                      One file of the mirror at the commit.

                      Args:
                          name: the tree relative path

                      Returns:
                          str | None: the text, None when the commit has no such file
                      """
                      try:
                          return self.git(["--git-dir", str(self.path(repo)), "show", f"{sha}:{name}"])
                      except FetchError:
                          return None


                  return read


          def fetch(plan_data: dict, dest: Path, git: Callable[[list[str]], str] = run_git) -> list[dict]:
              """
              Clone the extras, read the files named inside them, then fetch every pin.

              Args:
                  plan_data: what the plan command wrote
                  dest: the folder that holds mirrors/ and the manifest
                  git: runs git, run_git on a runner

              Returns:
                  list[dict]: the manifest, repo, ref, kind, sha and sources of each fetched ref

              Raises:
                  FetchError: on any refusal, or when git fails
              """
              caller_private = bool(plan_data["caller_private"])
              repositories   = set(plan_data["repositories"])
              mirrors        = Mirrors(dest, git)
              resolved: dict[str, str] = {}
              for extra in plan_data["extras"]:
                  repo, ref = extra["repo"], extra["ref"]
                  kind, sha = classify(repo, ref, mirrors.refs(repo), True, "extra_repos")
                  mirrors.fetch(repo, [{"ref": ref, "kind": kind, "sha": sha, "sources": ["extra_repos"]}])
                  resolved[repo] = sha
              pins: dict[
                  tuple[str, str],
                  list[str],
              ] = {(pin["repo"], pin["ref"]): list(pin["sources"]) for pin in plan_data["pins"]}
              for target in plan_data["scan"]:
                  repo, path = target["repo"], target["path"]
                  for pin in scan_tree(mirrors.reader(repo, resolved[repo]), [path], f"{repo}:", required = True):
                      check_repo(pin.repo, caller_private, pin.sources[0])
                      check_ref_text(pin.ref, pin.sources[0])
                      if pin.repo not in repositories:
                          raise FetchError(f"{pin.sources[0]}: {pin.repo} is pinned there, add it to token_repositories")
                      pins.setdefault((pin.repo, pin.ref), []).extend(pin.sources)
              by_repo: dict[str, list[dict]] = {}
              for (repo, ref), sources in sorted(pins.items()):
                  covered = lock_covers(repo, ref, sources, pins)
                  kind, sha = classify(repo, ref, mirrors.refs(repo), repo == FORMATTER, sources[0], defer_branch = covered)
                  if kind == "deferred":
                      print(f"  {repo}@{ref} from {', '.join(sources)} is a branch, left to the commit its lock pins")
                      continue
                  by_repo.setdefault(repo, []).append({"ref": ref, "kind": kind, "sha": sha, "sources": sources})
              for repo, wanted in by_repo.items():
                  mirrors.fetch(repo, wanted)
              return mirrors.entries

          # ======================================================================================================================
          # CLI
          # ======================================================================================================================

          def _write_output(name: str, value: str) -> None:
              """
              Append one output of the step to $GITHUB_OUTPUT when it is set.

              Args:
                  name: the output's name
                  value: its value, one line
              """
              target = os.environ.get("GITHUB_OUTPUT")
              if target:
                  with open(target, "a", encoding = "utf-8") as handle:
                      handle.write(f"{name}={value}\n")


          def main(argv: list[str] | None = None) -> int:
              """
              Run the plan or the fetch command.

              Args:
                  argv: the arguments, sys.argv when None

              Returns:
                  int: 0 on success, 1 on a refusal, printed as one error line
              """
              parser   = argparse.ArgumentParser(description = "Fetch the owner's private repos a lane needs as bare mirrors.")
              commands = parser.add_subparsers(dest = "command", required = True)
              plan_cmd = commands.add_parser("plan", help = "read the requirement files and write the plan")
              plan_cmd.add_argument("--caller", required = True, type = Path, help = "the caller's checkout")
              plan_cmd.add_argument("--out", required = True, type = Path, help = "where the plan is written")
              fetch_cmd = commands.add_parser("fetch", help = "clone what the plan names into bare mirrors")
              fetch_cmd.add_argument("--plan", required = True, type = Path, help = "the plan the plan command wrote")
              fetch_cmd.add_argument("--dest", required = True, type = Path, help = "the folder for mirrors/ and the manifest")
              args = parser.parse_args(argv)
              try:
                  if args.command == "plan":
                      data = plan(args.caller, dict(os.environ))
                      args.out.parent.mkdir(parents = True, exist_ok = True)
                      args.out.write_text(json.dumps(data, indent = 2), encoding = "utf-8")
                      _write_output("repositories", ",".join(data["repositories"]))
                      return 0
                  entries = fetch(json.loads(args.plan.read_text(encoding = "utf-8")), args.dest)
                  args.dest.mkdir(parents = True, exist_ok = True)
                  (args.dest / "manifest.json").write_text(json.dumps(entries, indent = 2), encoding = "utf-8")
                  token = os.environ.get("KDF_FETCH_TOKEN", "")
                  _write_output("token_sha256", hashlib.sha256(token.encode("utf-8")).hexdigest() if token else "")
                  return 0
              except FetchError as refusal:
                  print(f"::error::{refusal}")
                  return 1


          if __name__ == "__main__":
              sys.exit(main())
          KDF_FETCH_PRIVATE_PACKAGES

      - name: Plan the fetch
        id: plan
        env:
          REQUIREMENT_FILES: ${{ inputs.requirement_files }}
          EXTRA_REPOS: ${{ inputs.extra_repos }}
          SCAN_FILES: ${{ inputs.scan_files }}
          TOKEN_REPOSITORIES: ${{ inputs.token_repositories }}
          CALLER_PRIVATE: ${{ github.event.repository.private }}
          GITHUB_TOKEN: ${{ github.token }}
        run: /usr/bin/python3 -I "$RUNNER_TEMP/kdf-fetch/fetch_private_packages.py" plan --caller "$GITHUB_WORKSPACE/caller" --out "$RUNNER_TEMP/kdf-fetch/plan.json"

      # App token first (D-010), minted for exactly the repos the plan clones, never for every repo of the App
      - name: Mint GitHub App token for private-package installs
        id: pkg-token
        if: ${{ vars.USE_GITHUB_APP == 'true' && steps.plan.outputs.repositories != '' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.KDF_APP_ID }}
          private-key: ${{ secrets.KDF_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ steps.plan.outputs.repositories }}
          permission-contents: read

      # SECURITY: the token reaches git through this step's own GIT_CONFIG settings, written to no file, with no system
      #   or global config read. The mirrors are bare, no working tree, so no hook and no filter runs. Only the token's
      #   sha256 leaves the step, for the proof that the install job holds no copy of it
      - name: Clone the private packages as bare mirrors
        id: fetch
        if: ${{ steps.plan.outputs.repositories != '' }}
        env:
          GIT_CONFIG_NOSYSTEM: "1"
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_TERMINAL_PROMPT: "0"
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: ${{ format('url.https://__token__:{0}@github.com/.insteadOf', steps.pkg-token.outputs.token || secrets.GH_PACKAGES_PAT) }}
          GIT_CONFIG_VALUE_0: https://github.com/
          KDF_FETCH_TOKEN: ${{ steps.pkg-token.outputs.token || secrets.GH_PACKAGES_PAT }}
        run: /usr/bin/python3 -I "$RUNNER_TEMP/kdf-fetch/fetch_private_packages.py" fetch --plan "$RUNNER_TEMP/kdf-fetch/plan.json" --dest "$RUNNER_TEMP/kdf-private"

      - name: Pack the mirrors
        id: pack
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/kdf-private/mirrors"
          if [ ! -f "$RUNNER_TEMP/kdf-private/manifest.json" ]; then echo "[]" > "$RUNNER_TEMP/kdf-private/manifest.json"; fi
          tar -C "$RUNNER_TEMP" -cf "$RUNNER_TEMP/kdf-private.tar" kdf-private
          suffix=$(od -An -N6 -tx1 /dev/urandom | tr -d ' \n')
          echo "artifact=kdf-private-$RUN_ID-$RUN_ATTEMPT-$suffix" >> "$GITHUB_OUTPUT"

      # the mirrors, each repo's full history up to its refs, are readable for a day by everyone who can read the
      #   calling repo's runs, the price of D-035
      - name: Upload the mirrors
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.pack.outputs.artifact }}
          path: ${{ runner.temp }}/kdf-private.tar
          retention-days: 1
          if-no-files-found: error

  lint:
    name: Lint (ruff)
    needs: [fetch-private]
    # D-035. FAIL CLOSED. A skipped required job counts as passing, so this job runs whatever happened before it, a
    #   cancelled run included, and its first step ends it failed when the run was cancelled or, with package access,
    #   when the fetch did not succeed. GitHub reads cancelled() only in an if, so the step's if is the check and its
    #   run only says why. Written by scripts/render_fetch_job.py from its template
    if: ${{ always() }}
    permissions:
      contents: read
    runs-on: ubuntu-slim

    steps:
      - name: Require the private packages
        if: ${{ cancelled() || (inputs.needs_sdk_auth && needs.fetch-private.result != 'success') }}
        env:
          NEEDS_SDK_AUTH: ${{ inputs.needs_sdk_auth }}
          FETCH_RESULT: ${{ needs.fetch-private.result }}
        run: |
          if [ "$NEEDS_SDK_AUTH" = "true" ] && [ "$FETCH_RESULT" != "success" ]; then
            echo "::error::the private packages were not fetched, the fetch job ended $FETCH_RESULT, so nothing here runs"
          else
            echo "::error::the run was cancelled, so this job ends failed rather than skipped and tests nothing"
          fi
          exit 1

      # D-035. The tree's git config keeps no token, nothing this job runs reaches the repo's own remote
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ inputs.python_version }}

      # The slim runner lacks libpq, so psycopg2 (built from source — it ships
      # no manylinux wheels) fails with "pg_config executable not found".
      # Provide the build dependency so `pip install -r requirements.txt` works.
      - name: Install libpq (psycopg2 build dependency)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpq-dev

      # D-035. The private repos the fetch job cloned, as bare mirrors, which git reads through a rewrite of each https
      #   URL in the job's environment. No step of this job names a secret, and nothing it holds is one, its checkout
      #   leaves no token in the tree's git config
      - name: Download the private mirrors
        if: ${{ inputs.needs_sdk_auth }}
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ${{ needs.fetch-private.outputs.artifact }}
          path: ${{ runner.temp }}/kdf-private-download

      - name: Point git at the private mirrors
        if: ${{ inputs.needs_sdk_auth }}
        env:
          TOKEN_SHA256: ${{ needs.fetch-private.outputs.token_sha256 }}
        run: |
          set -euo pipefail
          tar -C "$RUNNER_TEMP" -xf "$RUNNER_TEMP/kdf-private-download/kdf-private.tar"
          count=0
          for mirror in "$RUNNER_TEMP"/kdf-private/mirrors/*.git; do
            [ -d "$mirror" ] || continue
            repo=$(basename "$mirror" .git)
            echo "GIT_CONFIG_KEY_$count=url.file://$mirror.insteadOf" >> "$GITHUB_ENV"
            echo "GIT_CONFIG_VALUE_$count=https://github.com/Needless2Say/$repo.git" >> "$GITHUB_ENV"
            count=$((count + 1))
          done
          {
            echo "GIT_CONFIG_COUNT=$count"
            echo "KDF_PRIVATE_MIRRORS=$RUNNER_TEMP/kdf-private"
            echo "KDF_FETCH_TOKEN_SHA256=$TOKEN_SHA256"
          } >> "$GITHUB_ENV"
          echo "git reads $count private mirror(s) through the rewrite"

      - name: Install dependencies
        run: ${{ inputs.install_command }}

      - name: Run ruff check
        run: ${{ inputs.lint_command }}
