name: Ops · Rotate secret (issue-triggered)

# Issue-form front-end for scripts/rotate_secret.py's expiry `check`, triggered ONLY when the `ops:rotate-secrets`
# label is added (a deliberate, owner-applied "go"). Authorization is enforced by the reusable owner-only gate; this
# repo is public, so the gate — not obscurity — is the control.
#
# Its `paste` and `generate` modes are retired (D-099). A value a person makes is staged in its own slot in cicd's ops
# and distributed by Ops · Distribute staged secrets, and the shared Vercel token is minted by Rotate Vercel
# Deployment Token alone, under its own schedule and dispatch. A check reads the registry and the recorded expiry facts,
# nothing secret, so this job names no environment and mints no token.
#
# SECURITY:
#   * Issue content is untrusted: parsed values flow through env vars into argv arrays, never inlined into a shell
#     string; the mode is allow-listed and the engine validates every secret name against the registry.
#   * `gh issue comment` bodies are NOT masked, so this workflow posts only a hand-built, metadata-only summary.

on:
  issues:
    types:
      - labeled

permissions:
  contents: read

jobs:
  authorize:
    if: github.event.action == 'labeled' && github.event.label.name == 'ops:rotate-secrets'
    uses: ./.github/workflows/_authorize-owner.yml

  run:
    name: Check secret expiry
    needs: authorize
    if: >-
      github.event.action == 'labeled' &&
      github.event.label.name == 'ops:rotate-secrets' &&
      needs.authorize.outputs.authorized == 'true' &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner
    runs-on: ubuntu-slim
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Extract and validate fields
        id: fields
        env:
          # Untrusted issue-form body — read only as awk DATA, never inlined into a command.
          BODY: ${{ github.event.issue.body }}
        run: |
          field() {
            awk -v lbl="### $1" '
              { sub(/\r$/, "") }
              $0 == lbl { cap = 1; next }
              /^### / { cap = 0 }
              cap && NF { print }
            ' <<< "$BODY"
          }
          # multi-selects render one option per line -> join with commas; single-selects take line 1.
          SECRETS="$(field "Secret(s)" | tr '\n' ',')"
          MODE="$(field "Mode" | head -1)"

          case "$MODE" in
            check) ;;
            *) echo "::error::invalid or missing mode: '${MODE}', the form checks expiry alone"; exit 1 ;;
          esac

          # normalize: strip CR + trailing comma; ALL / _No response_ -> empty -> 'all'
          norm() { local v; v="$(printf '%s' "$1" | tr -d '\r')"; v="${v%,}"; \
                   if [ -z "$v" ] || [ "$v" = "_No response_" ] || printf '%s' "$v" | tr ',' '\n' | grep -qix "ALL"; then echo "all"; else echo "$v"; fi; }
          SECRETS="$(norm "$SECRETS")"

          {
            echo "secrets=$SECRETS"
            echo "mode=$MODE"
          } >> "$GITHUB_OUTPUT"

      - name: Run the check
        id: rot
        env:
          SECRETS: ${{ steps.fields.outputs.secrets }}
          # the recorded expiry facts a check reads for the tokens the registry marks check.recorded
          EXPIRY_CICD_PAT: ${{ vars.EXPIRY_CICD_PAT }}
          EXPIRY_VERCEL_MASTER_TOKEN: ${{ vars.EXPIRY_VERCEL_MASTER_TOKEN }}
          EXPIRY_VERCEL_DEPLOYMENT_TOKEN: ${{ vars.EXPIRY_VERCEL_DEPLOYMENT_TOKEN }}
          EXPIRY_GH_PACKAGES_PAT: ${{ vars.EXPIRY_GH_PACKAGES_PAT }}
          EXPIRY_GH_NPM_TOKEN: ${{ vars.EXPIRY_GH_NPM_TOKEN }}
        run: |
          set +e
          python scripts/rotate_secret.py --mode check --secrets "$SECRETS"
          rc=$?
          set -e
          {
            echo "rc=$rc"
            echo "summary=mode=check secrets='${SECRETS}' (exit ${rc})"
          } >> "$GITHUB_OUTPUT"

      - name: Comment summary on the issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
          SUMMARY: ${{ steps.rot.outputs.summary }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "### Ops — secret expiry check"
            echo
            echo "${SUMMARY:-The check did not run (denied, or an earlier step failed).}"
            echo
            echo "_Full output is in the [Actions run](${RUN_URL}). No secret value is echoed here._"
          } > comment.md
          gh issue comment "$ISSUE" --repo "$REPO" --body-file comment.md
