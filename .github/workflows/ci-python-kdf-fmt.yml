name: Python · Style (kdf-fmt)

# The KDF house-style gate (kdf-fmt spec §8 ecosystem adoption; ADR D-003 toolchain
# split): kdf-fmt owns formatting + style, ruff stays narrowed to bug/security rules
# via ci-python-lint.yml. Successor to ci-python-format.yml (ruff format) for governed
# repos. kdf-fmt is stdlib-only, so this lane installs ONLY the pinned tool — never the
# caller's dependency tree — and stays fast on the slim runner.
#
# The caller pins `kdf_fmt_ref` to a vX.Y.Z tag: formatter output changes only arrive
# when the repo bumps its pin (kdf-fmt's versioned-style policy, spec §9-7).
permissions:
  contents: read

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to check out (tag, branch or SHA). Empty checks out the caller run's own ref, a release dispatch passes the release tag so this lane judges the exact commit being deployed.
        type: string
        default: ""
      python_version:
        description: Python version to use
        type: string
        default: "3.14"
      kdf_fmt_ref:
        description: Git ref of kriegerdataforge-fmt to install (pin a vX.Y.Z tag)
        type: string
        required: true
      check_command:
        description: The style-check command to run (config comes from the repo's kdf-fmt.toml)
        type: string
        default: "python -m kdf_fmt.cli check --no-cache"

jobs:
  style:
    name: Style (kdf-fmt)
    runs-on: ubuntu-slim

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ inputs.python_version }}

      # kriegerdataforge-fmt is a private repo, so this lane always needs package auth.
      # App-token-first (ADR D-010): when the caller opted in (USE_GITHUB_APP variable)
      # and holds the distributed App credentials, mint a short-lived installation token
      # (contents: read only, auto-revoked at job end); otherwise the install step falls
      # back to the long-lived GH_PACKAGES_PAT.
      - name: Mint GitHub App token for private-package installs
        id: pkg-token
        if: ${{ vars.USE_GITHUB_APP == 'true' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.KDF_APP_ID }}
          private-key: ${{ secrets.KDF_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: read

      # SECURITY: the token reaches git for this one step, through settings that live for the step's own processes
      #   (GIT_CONFIG_COUNT, KEY and VALUE) and are written nowhere. It used to go into the job's global git config,
      #   a file every later step could read, a test or a dependency a test imports among them. No later step
      #   holds it now, and none may name it (SDK review S1-48, kdf-sdk D-020)
      - name: Install kdf-fmt (pinned, stdlib-only — no consumer deps)
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: ${{ format('url.https://__token__:{0}@github.com/.insteadOf', steps.pkg-token.outputs.token || secrets.GH_PACKAGES_PAT) }}
          GIT_CONFIG_VALUE_0: https://github.com/
        run: python -m pip install --quiet "kdf-fmt @ git+https://github.com/Needless2Say/kriegerdataforge-fmt.git@${{ inputs.kdf_fmt_ref }}"

      - name: kdf-fmt check
        run: ${{ inputs.check_command }}
