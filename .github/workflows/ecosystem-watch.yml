name: Ecosystem watch (reusable)

# The weekly ecosystem watch (ADR D-049). Called by a PRIVATE repo's scheduled workflow, kriegerdataforge-context
# today, and never run in cicd, since cicd is public, so its runs, logs and issues are public too, while the watch
# reads the open Dependabot alerts of private repos. Everything below runs in the caller, its log, its secrets and
# its issue.
#
# It mints a read only token of the watch App over the owner's repos, runs scripts/ecosystem_watch.py from
# cicd's main, runs the kit's own check (distribute_kit.py check), keeps the JSON snapshot as an artifact for a later
# admin dashboard, and keeps ONE rolling issue labelled ops:ecosystem-watch in the caller, its body rewritten each
# run, a comment only when something is new, and closed when everything is clear. The log carries counts alone.
#
# The App needs these repository permissions, read only and approved on its installation. Dependabot alerts, Checks,
# Actions and Contents, on every repo. A permission it lacks fails the token step, which names it.
#
# Two contracts. The environment contract (the secrets fence): the caller names an environment of its own, held to
# main, holding the watch App's pair as KDF_WATCH_APP_ID and KDF_WATCH_APP_PRIVATE_KEY, and the job that mints binds
# it, so only a run from the caller's main reaches the key. The secrets contract, today's: the caller passes the pair
# as the named secrets app_id and app_private_key, kept until the caller moves.
#
# Caller, a private repo, the environment contract:
#   on:
#     schedule:
#       - cron: "0 10 * * 1"
#     workflow_dispatch:
#   permissions:
#     contents: read
#     issues: write
#   jobs:
#     watch:
#       uses: Needless2Say/kriegerdataforge-cicd/.github/workflows/ecosystem-watch.yml@main
#       with:
#         environment: watch

on:
  workflow_call:
    inputs:
      environment:
        description: The caller's environment holding the watch App's pair, held to main. Empty for the secrets contract
        required: false
        default: ""
        type: string
    secrets:
      app_id:
        description: The watch App's id, for a caller that names no environment
        required: false
      app_private_key:
        description: The watch App's private key, for a caller that names no environment
        required: false
      # the environment contract's names. The caller passes neither, the job that names its environment reads each
      # from there, since a reusable workflow's job that names an environment uses that environment's secret
      KDF_WATCH_APP_ID:
        description: The watch App's id, read from the caller's named environment, never passed
        required: false
      KDF_WATCH_APP_PRIVATE_KEY:
        description: The watch App's private key, read from the caller's named environment, never passed
        required: false

permissions:
  contents: read
  issues: write

# one watch at a time in a repo, so two runs never race on the issue
concurrency:
  group: ecosystem-watch-${{ github.repository }}
  cancel-in-progress: false

jobs:
  watch:
    name: Ecosystem watch
    runs-on: ubuntu-slim
    timeout-minutes: 15
    # the caller's environment when it names one, whose secrets this job alone then reads. Empty names none
    environment: ${{ inputs.environment }}
    env:
      LABEL: "ops:ecosystem-watch"
    steps:
      # before anything is read, the caller must be private, or its issue, artifact and log would publish private
      # repos' alerts. Asked of the API, since a scheduled run's event may not carry the repository
      - name: Refuse a public caller
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          private="$(gh api "repos/$REPO" --jq .private)"
          if [ "$private" != "true" ]; then
            echo "::error::only a private repo may call the ecosystem watch, and $REPO is not private"
            exit 1
          fi

      - name: Check out cicd's scripts
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: Needless2Say/kriegerdataforge-cicd
          ref: main
          sparse-checkout: |
            /scripts/
            /kit/KIT_VERSION
            /kit/common/
          sparse-checkout-cone-mode: false
          path: _kdf_cicd
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: pip install -r _kdf_cicd/scripts/requirements.txt

      # the repos the watch reads, cicd and every kit target as ecosystem_watch.py lists them (D-085, design 5.7)
      - name: List the repositories the watch reads
        id: targets
        run: python _kdf_cicd/scripts/token_repositories.py watch >> "$GITHUB_OUTPUT"

      # read only, over the repos listed above, an hour at most and revoked when the job ends
      - name: Mint a read only App token
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.app_id || secrets.KDF_WATCH_APP_ID }}
          private-key: ${{ secrets.app_private_key || secrets.KDF_WATCH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ steps.targets.outputs.repositories }}
          permission-contents: read
          permission-vulnerability-alerts: read
          permission-checks: read
          permission-actions: read

      - name: Collect the snapshot
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: python _kdf_cicd/scripts/ecosystem_watch.py collect --out "$RUNNER_TEMP/snapshot.json"

      # the kit's own check, on the same read token, every kit file and each repo's own standard files. Its output
      # reaches the issue only when it found drift, gaps or an error, and a clean check leaves the file empty
      - name: Run the kit's check
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          set +e
          python _kdf_cicd/scripts/distribute_kit.py check > "$RUNNER_TEMP/kit-check.out" 2>&1
          rc=$?
          set -e
          if [ "$rc" = 0 ]; then
            : > "$RUNNER_TEMP/kit-check.txt"
          else
            cp "$RUNNER_TEMP/kit-check.out" "$RUNNER_TEMP/kit-check.txt"
          fi
          echo "ecosystem-watch: the kit check exited $rc"

      - name: Keep the snapshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ecosystem-watch-snapshot
          path: ${{ runner.temp }}/snapshot.json
          retention-days: 30

      # the caller's own token, which may write issues in the caller alone
      - name: Open, update or close the rolling issue
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          gh label create "$LABEL" --repo "$REPO" --color 0E8A16 --force \
            --description "The weekly ecosystem watch (cicd D-049)" >/dev/null
          newest() {
            gh issue list --repo "$REPO" --label "$LABEL" --state "$1" --json number --jq '.[0].number // empty'
          }
          existing="$(newest open)"
          # the last closed issue, which a finding reopens rather than opening another, so news stays against it
          closed="$(newest closed)"
          previous="$RUNNER_TEMP/previous.md"
          : > "$previous"
          if [ -n "$existing" ]; then
            gh issue view "$existing" --repo "$REPO" --json body --jq .body > "$previous"
          elif [ -n "$closed" ]; then
            gh issue view "$closed" --repo "$REPO" --json body --jq .body > "$previous"
          fi
          python _kdf_cicd/scripts/ecosystem_watch.py render --snapshot "$RUNNER_TEMP/snapshot.json" \
            --previous "$previous" --body "$RUNNER_TEMP/body.md" --news "$RUNNER_TEMP/news.md" \
            --state "$RUNNER_TEMP/state.txt" --run-url "$RUN_URL" --kit-check "$RUNNER_TEMP/kit-check.txt"
          state="$(cat "$RUNNER_TEMP/state.txt")"
          if [ "$state" = clear ]; then
            if [ -n "$existing" ]; then
              # the clear body remembers nothing, so whatever reopens the issue later is news against it
              gh issue edit "$existing" --repo "$REPO" --body-file "$RUNNER_TEMP/body.md" >/dev/null
              gh issue comment "$existing" --repo "$REPO" --body "All clear, so this closes. $RUN_URL" >/dev/null
              gh issue close "$existing" --repo "$REPO" >/dev/null
              echo "ecosystem-watch: all clear, closed issue #$existing"
            else
              echo "ecosystem-watch: all clear"
            fi
            exit 0
          fi
          # the news is posted before the body that remembers it, so a comment that fails is posted by the next run,
          # never lost, and the worst a failed edit does is post the same news twice
          news() {
            if [ -s "$RUNNER_TEMP/news.md" ]; then
              gh issue comment "$1" --repo "$REPO" --body-file "$RUNNER_TEMP/news.md" >/dev/null
            fi
          }
          if [ -n "$existing" ]; then
            news "$existing"
            gh issue edit "$existing" --repo "$REPO" --body-file "$RUNNER_TEMP/body.md" >/dev/null
            echo "ecosystem-watch: updated issue #$existing"
          elif [ -n "$closed" ]; then
            gh issue reopen "$closed" --repo "$REPO" >/dev/null
            news "$closed"
            gh issue edit "$closed" --repo "$REPO" --body-file "$RUNNER_TEMP/body.md" >/dev/null
            echo "ecosystem-watch: reopened issue #$closed"
          else
            gh issue create --repo "$REPO" --title "Ecosystem watch" --label "$LABEL" \
              --body-file "$RUNNER_TEMP/body.md" >/dev/null
            echo "ecosystem-watch: opened the issue"
          fi
