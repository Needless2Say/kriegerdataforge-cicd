name: Distribute Agentic-Workflow Kit

# Propagates the canonical kit (kit/common/) to consumer repos via distribute_kit.py.
# See ADR D-001 / kriegerdataforge/docs/epics/agent-kit-distribution.md.
#
#   • workflow_dispatch — run on demand. 'check' (read-only drift report) or
#     'distribute' (open one sync PR per drifted repo; never auto-merges).
#
# The weekly read-only drift alarm runs in the ecosystem watch, on the watch App's read token, since this job mints
# from the writing App in ops, which waits for the owner's approval (the secrets fence). A drift there means some repo
# drifted from the canonical kit, or its own files lack part of the standard (the AGENTS.md role pointer,
# .env.kdf.example, .env.kdf ignored), which that repo fixes in its own PR, distribute opens none for it.
#
# Before the first 'distribute', each consumer repo's version-check must exempt the
# kit paths (ADR D-001 option B — shipped in scripts/common/check_version.py).

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "check (read-only drift report) or distribute (open sync PRs)"
        type: choice
        options:
          - check
          - distribute
        default: check
      only:
        description: "Optional: only this kit file (e.g. skills.md). Blank = all kit files."
        type: string
        default: ""
      repos:
        description: "Optional: comma-separated EXACT repo names to target (e.g. 'kriegerdataforge-sdk, fitness-app-backend'). Blank = all repos in the registry. Run 'check' first to preview the list."
        type: string
        default: ""

permissions:
  contents: read

jobs:
  authorize:
    uses: ./.github/workflows/_authorize-owner.yml

  distribute-kit:
    name: Distribute kit
    needs: authorize
    # Never run on forks (this repo is public). The owner gate passes first (PL-076 parity, fail-closed), and both
    # actors are tested here too, since a rerun of failed jobs alone keeps the gate's passed output.
    if: >-
      github.repository == 'Needless2Say/kriegerdataforge-cicd' &&
      needs.authorize.outputs.authorized == 'true' &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner
    runs-on: ubuntu-slim
    # the writing App's pair and CICD_PAT live in ops alone, held to main and waiting for the owner's approval
    environment: ops

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      # Short-lived GitHub App installation token (auto-revoked at job end; effective lifetime =
      # job runtime, not the 1-hour nominal TTL). Downscoped to contents + pull-requests write —
      # what distribute_kit needs to push a sync branch and open a PR. Gated on USE_GITHUB_APP,
      # falls back to CICD_PAT. The token names the repos this run targets, the registry's filtered by the repos input
      # as repo_sync filters them (D-085, design 5.7).
      - name: List the repositories the Distribute writes
        id: targets
        env:
          REPOS: ${{ github.event.inputs.repos }}
        run: python scripts/token_repositories.py kit --names="$REPOS" >> "$GITHUB_OUTPUT"

      - name: Mint GitHub App token
        id: app-token
        if: vars.USE_GITHUB_APP == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.KDF_WRITER_APP_ID }}
          private-key: ${{ secrets.KDF_WRITER_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ steps.targets.outputs.repositories }}
          permission-contents: write
          permission-pull-requests: write

      - name: Run distribute_kit
        env:
          # The token needs contents:read (check) + contents & pull-requests:write (distribute)
          # on the target repos.
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.CICD_PAT }}
          MODE: ${{ github.event.inputs.mode }}
          ONLY: ${{ github.event.inputs.only }}
          REPOS: ${{ github.event.inputs.repos }}
        run: |
          ARGS=("$MODE")
          if [ -n "$ONLY" ]; then
            ARGS+=(--only "$ONLY")
          fi
          if [ -n "$REPOS" ]; then
            ARGS+=(--repos "$REPOS")
          fi
          echo "Running: distribute_kit.py ${ARGS[*]}"
          python scripts/distribute_kit.py "${ARGS[@]}"
