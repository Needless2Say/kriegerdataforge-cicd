# Reusable CI workflow — Version bump check
#
# Validates that the VERSION file on a PR branch is exactly one valid semver
# increment ahead of the VERSION file on main:
#   • Patch:  X.Y.Z+1   (e.g., 0.1.0 → 0.1.1)
#   • Minor:  X.Y+1.0   (e.g., 0.1.3 → 0.2.0)
#   • Major:  X+1.0.0   (e.g., 0.9.9 → 1.0.0)
#
# Any other change (no bump, skip by 2, downgrade, wrong format) fails the job
# with a descriptive error message.
#
# The logic lives in scripts/common/check_version.py — the SAME script every
# consumer repo's version-check job runs from its `.cicd` checkout and every
# repo's `make ci-version-check` runs as the vendored scripts/check_version.py
# (ADR D-013). This workflow is a thin runner around it, kept for its published
# reusable contract; this repo's own ci.yml is its consumer.
#
# VERSION files are plain-text single-line semver strings (e.g., "0.1.0").
# Run `make bump-patch` (or bump-minor / bump-major) before opening a PR — CI
# does NOT auto-increment versions.
#
# Usage (consumer repo .github/workflows/ci.yml):
#   version-check:
#     if: github.event_name == 'pull_request'
#     uses: Needless2Say/kriegerdataforge-cicd/.github/workflows/bump-version-check.yml@main

name: Version Bump Check (reusable)

on:
  workflow_call:

jobs:
  version-check:
    name: Version bump check
    runs-on: ubuntu-slim

    permissions:
      contents: read

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      # This workflow runs in the kriegerdataforge-cicd checkout, which carries the
      # canonical script natively — no `.cicd` side-checkout needed.
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"

      - name: Validate version bump
        run: python scripts/common/check_version.py
