name: Check Secret Expiry

# Weekly monitor for CI-plane credential expiry. Runs `rotate_secret.py --mode check --secrets all --live`
# and keeps ONE deduplicated tracking issue (label: ops:secret-expiry) open until everything is healthy.
# Since D-049 each token the registry marks check.live is read by its own provider for its REAL expiry (the
# date alone is printed, never the value), and a registry date that disagrees is reported as drift, since
# the hand kept dates went stale in 2026-08 and 09 and taught the owner to close the issue:
#   * near/at expiry  -> create the issue (or update the existing one) listing what to rotate
#   * all healthy     -> auto-close the open issue
#
# The auto-mintable Vercel tokens self-heal via "Rotate Vercel Tokens". The GitHub PATs and the Vercel
# master token can't be minted via API, so this issue is the monthly nudge to rotate them by hand —
# recipes in the owner's SECRET_ROTATION.md §8 (kriegerdataforge-context/ops/, private).

on:
  schedule:
    - cron: "0 9 * * 1" # every Monday 09:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    name: Check secret expiry
    runs-on: ubuntu-slim
    env:
      GH_TOKEN: ${{ github.token }}
      LABEL: "ops:secret-expiry"
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      # Each token named below is handed to its own provider alone, GitHub's rate_limit or Vercel's token metadata,
      # to read its real expiry, the date alone printed (D-049). A token the registry marks check.live but that is
      # absent here falls back to the registry's hand kept date.
      - name: Run expiry check
        id: check
        env:
          CICD_PAT: ${{ secrets.CICD_PAT }}
          GH_PACKAGES_PAT: ${{ secrets.GH_PACKAGES_PAT }}
          VERCEL_MASTER_TOKEN: ${{ secrets.VERCEL_MASTER_TOKEN }}
        run: |
          set +e
          python scripts/rotate_secret.py --mode check --secrets all --live | tee check.out
          rc=${PIPESTATUS[0]}
          set -e
          # fail closed. A check that crashed prints no verdict, and empty outputs would close the issue as healthy
          if ! grep -qE '^NEEDS_ROTATION: ' check.out || ! grep -qE '^REGISTRY_DRIFT: ' check.out; then
            echo "::error::rotate_secret.py --mode check gave no verdict (exit $rc), the issue is left as it is"
            exit 1
          fi
          needs="$(grep -E '^NEEDS_ROTATION: ' check.out | sed 's/^NEEDS_ROTATION: //')"
          drift="$(grep -E '^REGISTRY_DRIFT: ' check.out | sed 's/^REGISTRY_DRIFT: //')"
          {
            echo "needs=$needs"
            echo "drift=$drift"
            echo "rc=$rc"
          } >> "$GITHUB_OUTPUT"

      - name: Open / update / close the tracking issue
        env:
          NEEDS: ${{ steps.check.outputs.needs }}
          DRIFT: ${{ steps.check.outputs.drift }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create "$LABEL" --color FBCA04 --description "A monitored secret is near/at expiry" 2>/dev/null || true
          existing="$(gh issue list --repo "$REPO" --label "$LABEL" --state open --json number --jq '.[0].number // empty')"

          if [ -n "$NEEDS" ] || [ -n "$DRIFT" ]; then
            {
              echo "## Secret(s) due for rotation, or a registry date to correct"
              echo
              echo "The weekly expiry monitor flagged these credentials:"
              echo
              grep -E 'WARNING|EXPIRED|ERROR|REJECTED|DRIFT' check.out | grep -v '^REGISTRY_DRIFT: ' \
                | sed 's/^ *//; s/^/- /' || true
              echo
              if [ -n "$DRIFT" ]; then
                echo "**Registry dates that disagree with the provider:** \`${DRIFT}\`. GitHub or Vercel"
                echo "reported each date itself (D-049), so set that secret's \`check.expiry\` in"
                echo "\`scripts/secret_registry.json\` to it."
                echo
              fi
              echo "**What to do:** follow the matching recipe in the owner's [\`SECRET_ROTATION.md\`](https://github.com/Needless2Say/kriegerdataforge-context/blob/main/ops/SECRET_ROTATION.md) §8."
              echo "- GitHub PATs (\`CICD_PAT\`, \`GH_PACKAGES_PAT\`) and the Vercel master token are **rotated by hand** — GitHub/Vercel can't mint them via API."
              echo "- The shared \`VERCEL_DEPLOYMENT_TOKEN\` auto-rotates via the **Rotate Vercel Deployment Token** workflow (no action needed)."
              echo
              echo "After rotating, update that secret's \`check.expiry\` in \`scripts/secret_registry.json\` and commit — **this issue auto-closes** once the next weekly check is clean."
              echo
              echo "_Monitor run: ${RUN_URL}. Each live token went to its own provider alone, no value is shown._"
            } > issue.md
            if [ -n "$existing" ]; then
              gh issue edit "$existing" --repo "$REPO" --body-file issue.md
              echo "Updated existing tracking issue #$existing"
            else
              gh issue create --repo "$REPO" \
                --title "[Ops] Secret(s) due for rotation: ${NEEDS:-none}${DRIFT:+, registry drift}" \
                --label "$LABEL" --label ops --assignee Needless2Say \
                --body-file issue.md
            fi
          else
            if [ -n "$existing" ]; then
              gh issue close "$existing" --repo "$REPO" \
                --comment "All monitored secrets are within their expiry windows ✅ (auto-closed by the expiry monitor)."
              echo "Closed tracking issue #$existing"
            else
              echo "All monitored secrets healthy; no open tracking issue."
            fi
          fi
