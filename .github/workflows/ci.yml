# CI, runs on every PR targeting main (opened, updated, reopened).
#
# Jobs:
#   lint            actionlint validates every .github/workflows/*.yml file
#   style           kdf-fmt, the KDF house style, over scripts/
#   test            pytest runs the Python unit tests in scripts/tests/
#   version-check   VERSION is exactly one step ahead of main
#   secret-scan     gitleaks over the pull request's commits
#   secretless-proof, secretless-control
#                   D-035's proof that the unit lane's install job holds no secret, and its positive control
#
# Every job must pass before a PR can be merged. The owner sets them as required status checks in the repo's
# ruleset for main. The two D-035 jobs run only where the secrets exist and are not required checks.

name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

# Every job reads the repo, and the secret scan also reads the pull request's commits. A called workflow never holds
# more than its caller grants, and without pull-requests: read the whole run fails at startup with no check at all.
permissions:
  contents: read
  pull-requests: read

jobs:
  lint:
    name: Lint workflows (actionlint)
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install actionlint
        # PL-142: pin the version + verify the binary sha256 instead of piping the
        # installer script from the mutable `main` ref and installing `latest`. Bump
        # both ACTIONLINT_VERSION and ACTIONLINT_SHA256 in lockstep from the release's
        # actionlint_<ver>_checksums.txt.
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          set -euo pipefail
          curl -sfL \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            -o /tmp/actionlint.tar.gz
          echo "${ACTIONLINT_SHA256}  /tmp/actionlint.tar.gz" | sha256sum -c -
          tar -xzf /tmp/actionlint.tar.gz -C /usr/local/bin actionlint
          rm /tmp/actionlint.tar.gz
          actionlint -version

      - name: Run actionlint
        run: actionlint

  # KDF house style over scripts/, baseline gated so only NEW violations fail. D-038, this public repo runs its own
  # one job check, ci-kdf-fmt-self.yml, because the shared lane's fetch refuses a public caller's mirror of the private
  # formatter. The shared lane's fetch job is the seven lanes' template, which the secretless proof below runs, and its
  # check job is held to the template by test_secretless_lanes.py
  style:
    uses: ./.github/workflows/ci-kdf-fmt-self.yml
    with:
      kdf_fmt_ref: v1.1.0
    secrets: inherit

  test:
    name: Python unit tests
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: scripts/requirements-test.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements-test.txt

      - name: Run tests
        run: cd scripts && pytest tests/ --tb=short

  version-check:
    uses: Needless2Say/kriegerdataforge-cicd/.github/workflows/bump-version-check.yml@main

  # The secret scan every other repo calls, now run on this public repo too. A local reference, like style, so a change
  # to secret-scan.yml is exercised by the pull request that makes it. It uses the default gitleaks rules, since this
  # repo has no .gitleaks.toml, and its full history held no finding on gitleaks 8.30.1 on 2026-09-29.
  secret-scan:
    uses: ./.github/workflows/secret-scan.yml

  # D-035's proof, on the pull request itself, before any repo depends on the change. The unit test lane, by a local
  # reference so the pull request's own version runs, with package access on. Its fetch job mirrors this public repo,
  # the stand in for the owner's private packages, a tag the fixture pins and the pull request's branch, and the install
  # job installs a probe from the mirror and hunts for a secret where root could read one, every environment and the
  # runner's own memory. It must find none. Only where the secrets exist, so not for Dependabot or a fork, and not a
  # required check.
  secretless-proof:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' }}
    uses: ./.github/workflows/ci-python-tests.yml
    with:
      needs_sdk_auth: true
      requirement_files: tests/fixtures/secretless/requirements.txt
      extra_repos: kriegerdataforge-cicd@${{ github.head_ref }}
      install_command: >-
        pip install "kdf-secretless-probe @ git+https://github.com/Needless2Say/kriegerdataforge-cicd.git@${{ github.head_ref }}#subdirectory=tests/fixtures/secretless/probe"
      test_command: python tests/fixtures/secretless/hunt.py absent
    secrets: inherit

  # The positive control. A job that names the App's secrets and mints a token, where the same hunt must FIND the key
  # and the token in the runner's memory, otherwise the proof's empty result would prove nothing.
  secretless-control:
    name: Secret hunt, positive control
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Mint a token the way a fetch job does
        id: control-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.KDF_APP_ID }}
          private-key: ${{ secrets.KDF_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: kriegerdataforge-cicd
          permission-contents: read

      # only the token's sha256 reaches the hunt, it prints counts and never a value
      - name: Hunt where the secrets are
        env:
          CONTROL_TOKEN: ${{ steps.control-token.outputs.token }}
        run: |
          token_sha256=$(printf '%s' "$CONTROL_TOKEN" | sha256sum | cut -d ' ' -f 1)
          # the token's shape, never its value, so a hunt that misses it says why
          shape="${#CONTROL_TOKEN} characters"
          if [[ "$CONTROL_TOKEN" == ghs_* ]]; then shape="$shape, ghs_ prefix"; fi
          if [[ "$CONTROL_TOKEN" =~ ^[A-Za-z0-9_]+$ ]]; then shape="$shape, letters, digits and underscores only"; fi
          echo "the minted token is $shape"
          /usr/bin/python3 -I tests/fixtures/secretless/hunt.py present --token-sha256 "$token_sha256"
