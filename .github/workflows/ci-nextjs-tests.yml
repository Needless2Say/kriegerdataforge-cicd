name: Node.js · Unit tests (Jest)

on:
  workflow_call:
    inputs:
      node_version:
        description: Node.js version to use
        type: string
        default: "24"
      ref:
        description: Git ref to check out (tag, branch or SHA). Empty checks out the caller run's own ref, a release dispatch passes the release tag so this lane tests the exact commit being deployed.
        type: string
        default: ""
      skip:
        description: Skip every job of this lane, each reporting skipped, which a required check counts as passing. A caller passes its docs only answer, true only after its secret scan succeeded and said every changed path is docs (D-075). False runs every job, a cancelled run ending them failed
        type: boolean
        default: false

jobs:
  unit-tests:
    name: Unit Tests
    # D-075. FAIL CLOSED. A skipped required job counts as passing, so this job runs whatever happened before it, a
    #   cancelled run included, and its first step ends it failed when the run was cancelled. Only skip, the caller's
    #   docs only answer, skips it whole. GitHub reads cancelled() only in an if, so the step's if is the check
    if: ${{ always() && !inputs.skip }}
    runs-on: ubuntu-slim

    steps:
      - name: Fail a cancelled run
        if: ${{ cancelled() }}
        run: |
          echo "::error::the run was cancelled, so this job ends failed rather than skipped and checks nothing"
          exit 1

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ inputs.node_version }}
          cache: "npm"

      - name: Install dependencies
        env:
          # Private GH-Packages npm auth (reports-ecosystem epic W3.5): consumers that
          # depend on @needless2say/* commit an .npmrc interpolating ${GH_NPM_TOKEN} — a
          # CLASSIC read:packages PAT (GH Packages rejects fine-grained PATs and App
          # installation tokens). Always exported; empty for token-less consumers.
          GH_NPM_TOKEN: ${{ secrets.GH_NPM_TOKEN }}
        run: npm ci

      - name: Unit tests
        run: make ci-unit-tests
