# Reusable secret-scanning workflow — gitleaks
#
# Scans a consumer repo's working tree AND full git history for committed
# secrets (API tokens, private keys, passwords, connection strings).
#
# Defence-in-depth: the audit (2026-06-05) confirmed no secrets are currently
# committed in any KDF repo, but real secret files (*.tfvars, .env.local) live
# on contributors' disks. This workflow fails the build if any secret is ever
# pushed, complementing the local pre-commit hook.
#
# Usage (consumer repo .github/workflows/ci.yml):
#   jobs:
#     secret-scan:
#       uses: Needless2Say/kriegerdataforge-cicd/.github/workflows/secret-scan.yml@main

name: Secret Scan (reusable)

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to check out (tag, branch or SHA). Empty checks out the caller run's own ref, a release dispatch passes the release tag so this lane judges the exact commit being deployed.
        type: string
        default: ""
      fetch-depth:
        description: 'Git history depth to scan (0 = full history)'
        required: false
        type: number
        default: 0

permissions:
  contents: read
  pull-requests: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.ref }}
          # full history so a secret committed in any past commit is caught,
          # not just the current tree
          fetch-depth: ${{ inputs.fetch-depth }}

      - name: Refuse committed env files
        # A .env file holds real values even when gitleaks sees none, a low entropy password or a local key, so none
        # is ever committed. Only an example is, .env.local.example or .env.kdf.example for instance (ADR D-030).
        run: |
          set -euo pipefail
          committed="$(git ls-files | grep -E '(^|/)\.env([.][^/]*)?$' | grep -vE '\.example$' || true)"
          if [ -n "$committed" ]; then
            echo "::error::A .env file is committed. Only an example may be. Remove it from git and keep it local."
            printf '%s\n' "$committed"
            exit 1
          fi
          echo "No .env file committed, only examples."

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          # the action installs gitleaks 8.24.3 unless told otherwise, and 8.24.3 ignores the [[allowlists]] array
          # without a word, it arrived in 8.25.0. fitness-app-backend, reports-sdk and terraform allowlist that way,
          # so no allowlist of theirs applied in any scan and a pull request touching an allowlisted fixture failed.
          # 8.30.1 scans the full history of all 18 calling repos clean with their own configs (2026-09-14)
          GITLEAKS_VERSION: "8.30.1"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # no GITLEAKS_LICENSE needed for public repos / individual use
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "true"
          GITLEAKS_ENABLE_SUMMARY: "true"
