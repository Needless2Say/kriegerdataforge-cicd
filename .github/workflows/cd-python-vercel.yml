# Reusable CD workflow — Python FastAPI → Vercel
#
# Called by consumer repos to deploy the FastAPI backend to a Vercel project.
# The `environment` input names the GitHub Environment the deploy job runs under:
#   1. Loads its secrets. A job with `environment:` reads repository AND environment
#      secrets together, so the two singular tokens live at REPOSITORY level (one value
#      everywhere) while the genuinely per-env values stay environment-scoped.
#   2. Pauses for approval only where the calling repository's environment configures
#      a required reviewer. None does today (measured 2026-09-17, no environment
#      carries a reviewer or a branch policy), so the deployer authorization gate
#      below is what stands in front of the token.
#
# Deploy steps (hub register row 83, the owner's order of 2026-09-25):
#   1. Compact api/ into vercel_api/app/ via vercel_compactor.py
#   2. Deploy vercel_api/ to the target Vercel project WITHOUT its domains (--skip-domain),
#      so the release that is serving keeps serving
#   3. Optionally run Alembic migrations against DB_DATABASE_URL
#   4. Smoke the new deployment's /healthz. A release that refuses at boot stops here,
#      never promoted, and the migration is undone to the revision found in step 3
#   5. Promote the deployment to the production domains
#
# Optional environment secret:
#   VERCEL_AUTOMATION_BYPASS_SECRET — the project's "Protection Bypass for Automation"
#                                     value, sent on the smoke when Vercel's deployment
#                                     protection covers the deployment URL. Without it the
#                                     protection answers the smoke with a 302 to vercel.com's
#                                     sign in (measured 2026-09-25 on the hub's DEV project),
#                                     or a 401, and the smoke says so
#
# Repository secrets (one global value — set at repo level, NOT per environment):
#   VERCEL_DEPLOYMENT_TOKEN — shared Vercel deploy/management token
#   GH_PACKAGES_PAT    — GitHub PAT (repo read scope) for installing kdf-auth-sdk
# Environment secrets (set per environment in the caller repo):
#   VERCEL_ORG_ID      — Vercel team / org ID
#   VERCEL_PROJECT_ID  — Vercel project ID for the target environment
#   DB_DATABASE_URL    — SQLAlchemy connection string (required if run_migrations=true)
#
# Usage (consumer repo .github/workflows/cd.yml):
#   jobs:
#     deploy:
#       uses: Needless2Say/kriegerdataforge-cicd/.github/workflows/cd-python-vercel.yml@main
#       with:
#         environment: ${{ inputs.environment }}
#         version: ${{ inputs.version }}
#       secrets: inherit

name: CD — Python → Vercel (reusable)

on:
  workflow_call:
    inputs:
      environment:
        description: 'Target GitHub Environment ("dev" or "prod")'
        required: true
        type: string
      run_migrations:
        description: 'Run "alembic upgrade head" after the deployment and before its promotion'
        required: false
        type: string
        default: 'true'
      version:
        description: 'Version to deploy (e.g. 1.2.0). Specify an older version to roll back.'
        required: true
        type: string

jobs:
  # ── Deployer authorization gate ───────────────────────────────────────────
  # Runs BEFORE the deploy job, and BEFORE the GitHub Environment approval is
  # requested. Verifies the user who dispatched this run is an approved deployer
  # for this repo + environment, per the central allow-list in
  # kriegerdataforge-cicd (scripts/deployer_registry.json). Fails closed.
  authorize:
    name: Authorize deployer
    runs-on: ubuntu-slim
    permissions:
      contents: read
    steps:
      - name: Check out deployer registry (kriegerdataforge-cicd)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: Needless2Say/kriegerdataforge-cicd
          ref: main
          sparse-checkout: scripts
          path: _kdf_cicd
          # The cicd repo is public, so the caller's default github.token can read it.
          # (If cicd ever goes private, this checkout needs a read-only token with access
          # to it — see KDF docs/engineering/GITHUB_FUTURE_ENHANCEMENTS.md.)
          token: ${{ github.token }}

      - name: Verify deployer is approved
        run: python3 _kdf_cicd/scripts/check_deployer.py
        env:
          DEPLOY_REPO: ${{ github.repository }}
          DEPLOY_ACTOR: ${{ github.triggering_actor }}
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}

  deploy:
    name: Deploy (${{ inputs.environment }})
    needs: authorize
    runs-on: ubuntu-slim

    # Names the caller repo's GitHub Environment. The job reads its secrets, and pauses for
    # approval only where that environment configures a required reviewer. None does today
    # (measured 2026-09-17), so the deployer authorization gate above is the control. No
    # id-token permission: the pinned Vercel CLI never requests a GitHub OIDC token.
    environment: ${{ inputs.environment }}

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: v${{ inputs.version }}

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          git config --global url."https://__token__:${GH_PACKAGES_PAT}@github.com/".insteadOf "https://github.com/"
          pip install -r requirements.txt
        env:
          GH_PACKAGES_PAT: ${{ secrets.GH_PACKAGES_PAT }}

      - name: Compact API for Vercel
        run: python scripts/vercel_compactor.py

      - name: Validate Vercel project binding
        run: |
          if [ -z "${VERCEL_PROJECT_ID:-}" ]; then
            echo "❌  VERCEL_PROJECT_ID is not set in the GitHub Environment."
            echo "    Without it the Vercel CLI falls back to org-wide project discovery"
            echo "    and may deploy to the wrong project or trigger other projects."
            echo "    Set VERCEL_PROJECT_ID in the '${{ inputs.environment }}' environment"
            echo "    secrets for this repo and re-run."
            exit 1
          fi
          echo "✅  Deploying to Vercel project: $VERCEL_PROJECT_ID"
        env:
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Install Vercel CLI
        # Pin the Vercel CLI to an exact version: this job holds VERCEL_DEPLOYMENT_TOKEN,
        # GH_PACKAGES_PAT and (on migrations) DB_DATABASE_URL, so an unpinned
        # install floating to the latest registry tarball is a poisoned-pipeline
        # / dependency-chain risk (CICD-SEC-3 / SLSA). Bump via Dependabot.
        run: npm install -g vercel@58.5.1

      - name: Deploy to Vercel, without the domains
        id: deploy
        working-directory: vercel_api
        # The release is built and deployed to the production target but NOT promoted: --skip-domain
        # leaves the production domains on the release that is serving. The migration runs against
        # the new code's schema next, the new deployment is smoked, and only then are the domains
        # moved (hub register row 83). A release that refuses at boot is therefore never migrated
        # behind, and never serves.
        run: |
          # A VERCEL_DEPLOYMENT_TOKEN secret pasted by hand often carries a trailing newline/space, which
          # the Vercel CLI rejects ("The specified token is not valid") even though the token itself is valid.
          # Strip whitespace, fail fast if empty, mask the trimmed value (a different string from the raw
          # secret, which automatic masking does not cover) and pass it explicitly via --token here and at
          # the promotion. Only the LENGTH is logged for debugging — the token value is never printed.
          TOKEN="$(printf '%s' "$VERCEL_DEPLOYMENT_TOKEN" | tr -d '[:space:]')"
          if [ -z "$TOKEN" ]; then
            echo "::error::VERCEL_DEPLOYMENT_TOKEN is empty — set the VERCEL_DEPLOYMENT_TOKEN repository secret on the calling repo (one value, read by every environment)."
            exit 1
          fi
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"
          echo "VERCEL_DEPLOYMENT_TOKEN trimmed length=${#TOKEN}; org=${VERCEL_ORG_ID}; project=${VERCEL_PROJECT_ID}"
          # the CLI prints the deployment URL alone on stdout, its progress goes to stderr
          URL="$(NODE_OPTIONS="--require ./dns-preload.js" vercel deploy --prod --yes --skip-domain \
            --token "$TOKEN" \
            --build-env "GH_PACKAGES_PAT=$GH_PACKAGES_PAT" | tail -n 1)"
          case "$URL" in
            https://*) ;;
            *) echo "::error::vercel deploy printed no deployment URL (got '${URL}')"; exit 1 ;;
          esac
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "deployed, not yet promoted: $URL"
        env:
          VERCEL_DEPLOYMENT_TOKEN: ${{ secrets.VERCEL_DEPLOYMENT_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          GH_PACKAGES_PAT: ${{ secrets.GH_PACKAGES_PAT }}

      # psycopg2 (the source build pinned in requirements, not psycopg2-binary)
      # links libpq dynamically and needs libpq.so.5 at import time. The slim
      # runner image does not ship it (Vercel's runtime does, so the deployed app
      # is unaffected), so install the runtime library before Alembic imports the
      # driver. Guarded to the migration path so non-migrating deploys skip it.
      - name: Install libpq (psycopg2 runtime dependency)
        if: inputs.run_migrations == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpq5

      - name: Run Alembic migrations
        if: inputs.run_migrations == 'true'
        id: migrate
        # The revision in place is recorded first, so a smoke failure below can undo the
        # upgrade to exactly it (the hub's rule, a release and its migrations in one window
        # with full downgrades). It is read from alembic's verbose report, whose revision lines
        # alembic itself writes as `Rev: <id>`, because a repo's alembic/env.py may print lines
        # of its own to stdout and the hub's does. The first DEV dispatch (2026-09-25) recorded
        # its first word, `[Alembic]`, and the undo could not run. An empty database reports no
        # revision, which is `base`, and alembic's own header is what proves it reported at all,
        # so a report with neither stops the step before anything is upgraded. The report is
        # never printed, its header carries the database URL. ENVIRONMENT is the state the run
        # deploys to, the label a repo's env.py prints (the SDK reads an unset one as PROD). It
        # picks no database, DB_DATABASE_URL does.
        run: |
          REPORT="$(alembic current --verbose)"
          BEFORE="$(awk '$1 == "Rev:" { print $2; exit }' <<< "$REPORT")"
          if [ -z "$BEFORE" ] && ! grep -q '^Current revision(s) for ' <<< "$REPORT"; then
            echo "::error::alembic reported no current revision and no header, the schema is left as it is"
            exit 1
          fi
          echo "before=${BEFORE:-base}" >> "$GITHUB_OUTPUT"
          echo "schema before the upgrade: ${BEFORE:-base}"
          alembic upgrade head
        env:
          DB_DATABASE_URL: ${{ secrets.DB_DATABASE_URL }}
          ENVIRONMENT: ${{ inputs.environment }}

      - name: Smoke the new deployment before it serves
        id: smoke
        # /healthz answers as soon as the process is up and sits outside the hub's service key
        # gate. A deployment that refuses at boot answers 500 here and is never promoted. Vercel's
        # deployment protection answers a plain request to a protected deployment URL with a 302
        # to vercel.com's sign in (measured 2026-09-25 on the hub's DEV project) or a 401, until
        # the project's bypass secret rides along, so the redirect target is read beside the code.
        run: |
          set +e
          URL="${DEPLOY_URL}/healthz"
          code=""
          protected=""
          for attempt in 1 2 3 4 5 6; do
            if [ -n "$BYPASS" ]; then
              answer="$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' -H "x-vercel-protection-bypass: $BYPASS" "$URL")"
            else
              answer="$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' "$URL")"
            fi
            code="${answer%% *}"
            location="${answer#* }"
            if [ "$code" = "200" ]; then
              echo "healthz answered 200 on attempt ${attempt}"
              exit 0
            fi
            case "$location" in
              https://vercel.com/sso-api*) protected="yes" ;;
            esac
            if [ "$code" = "401" ]; then protected="yes"; fi
            echo "attempt ${attempt}: healthz answered ${code:-nothing}${protected:+ from Vercel deployment protection}"
            sleep 10
          done
          if [ -n "$protected" ] && [ -z "$BYPASS" ]; then
            echo "::error::the deployment URL sits behind Vercel's deployment protection and no VERCEL_AUTOMATION_BYPASS_SECRET is set, add the project's Protection Bypass for Automation value to this environment"
          elif [ -n "$protected" ]; then
            echo "::error::the deployment URL sits behind Vercel's deployment protection and it refused VERCEL_AUTOMATION_BYPASS_SECRET, the value is not this project's Protection Bypass for Automation"
          else
            echo "::error::the new deployment does not answer /healthz with 200, it is not promoted"
          fi
          exit 1
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
          BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

      - name: Undo the migration, the new release will not serve
        if: failure() && steps.smoke.outcome == 'failure' && inputs.run_migrations == 'true'
        run: alembic downgrade "$BEFORE"
        env:
          BEFORE: ${{ steps.migrate.outputs.before }}
          DB_DATABASE_URL: ${{ secrets.DB_DATABASE_URL }}
          ENVIRONMENT: ${{ inputs.environment }}

      - name: Promote the deployment to the production domains
        working-directory: vercel_api
        run: NODE_OPTIONS="--require ./dns-preload.js" vercel promote "$DEPLOY_URL" --yes --token "$TOKEN"
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
          TOKEN: ${{ steps.deploy.outputs.token }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
