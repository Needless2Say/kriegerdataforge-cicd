name: Python · System tests (source and bundle)

# Reusable system lane for the KDF Python backends (D-027). The caller's `system_tests/` suite runs the
# backend as a real server, on the source and on the Vercel bundle, and reaches it over HTTP against a
# Postgres of its own. It is the one suite that reads the bundle as it ships, so it catches a defect the
# bundle alone carries, which no test that imports the source can.
#
# The suite's harness builds each server's environment from nothing and makes its own keys and schema,
# so the job hands it the database alone. The database is never `kdf_test`, a system test commits rows
# and the integration suite, which rolls back, would read them.

# Least privilege, the lane clones and runs tests and never writes to the repo.
permissions:
  contents: read

on:
  workflow_call:
    inputs:
      python_version:
        description: Python version to use
        type: string
        default: "3.14"
      install_command:
        description: Command to install dependencies before running tests
        type: string
        default: "pip install -r requirements.txt"
      test_command:
        description: Full pytest command to run the system suite
        type: string
        default: "python -m pytest system_tests/ -q --tb=short -p no:warnings -ra"
      needs_sdk_auth:
        description: Configure git credentials for the private packages (App installation token when the caller sets USE_GITHUB_APP, else the GH_PACKAGES_PAT secret)
        type: boolean
        default: false
      ref:
        description: Git ref to check out (tag, branch or SHA). Empty checks out the caller run's own ref, the PROD Gate passes the release tag so this lane tests the exact commit being deployed.
        type: string
        default: ""

jobs:
  system-tests:
    name: System Tests (source and bundle)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kdf
          POSTGRES_PASSWORD: kdf
          POSTGRES_DB: kdf_system
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kdf -d kdf_system"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15

    env:
      KDF_SYSTEM_DATABASE_URL: postgresql+psycopg2://kdf:kdf@localhost:5432/kdf_system

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ inputs.python_version }}

      # Private-package auth is App-token-first (reports-ecosystem epic W2.5, ADR D-010): when
      # the calling repo opted in (USE_GITHUB_APP variable) and holds the distributed App
      # credentials (ops:distribute-app-secrets), mint a short-lived installation token —
      # contents: read only, auto-revoked at job end — for the pip git+https installs. Skipped
      # (not failed) when the caller never opted in; the next step then falls back to the
      # long-lived GH_PACKAGES_PAT exactly as before.
      - name: Mint GitHub App token for private-package installs
        id: pkg-token
        if: ${{ inputs.needs_sdk_auth && vars.USE_GITHUB_APP == 'true' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.KDF_APP_ID }}
          private-key: ${{ secrets.KDF_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: read

      - name: Configure private SDK access
        if: ${{ inputs.needs_sdk_auth }}
        env:
          PKG_INSTALL_TOKEN: ${{ steps.pkg-token.outputs.token || secrets.GH_PACKAGES_PAT }}
        run: git config --global url."https://__token__:${PKG_INSTALL_TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: Install dependencies
        run: ${{ inputs.install_command }}

      - name: Run system tests
        run: ${{ inputs.test_command }}
