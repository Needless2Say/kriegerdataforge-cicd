name: Run KDF E2E journey
description: >-
  Build + run one tenant's Tier-2 Playwright OIDC journey against the real ecosystem
  stack. Reusable across tenant repos: the calling repo owns a thin CI job (gated by
  its RUN_E2E_GATE variable) that checks itself out into a sibling-named path and then
  `uses:` this action. Tenant-agnostic — it reads the CALLER's e2e/manifest.json for
  the journey and the sibling repos to check out, so it never hardcodes tenant names.
  The App token's reach comes from the manifest on the caller's DEFAULT branch, and
  every sibling is checked out at the caller's own branch name when it has one, so a
  change spanning two repos is tested together before either merges. See
  kriegerdataforge-cicd/docs/design/e2e-cijob-refactor.md (ADR D-007, amended by D-016).

inputs:
  journey:
    description: >-
      Journey to run. Read from the caller's e2e/manifest.json when empty, the usual
      shape, and it must equal that manifest's 'journey' when given, a job runs its own
      repo's journey and no other.
    required: false
    default: ""
  sibling-ref:
    description: >-
      Branch of every sibling repo to check out. Empty means the caller's own branch
      name where the sibling has one, and the sibling's default branch otherwise.
    required: false
    default: ""
  # Everything above `runs:` is literal text. GitHub evaluates an expression written into a
  # description at load, and a composite action has no `secrets` context, so the two descriptions
  # below name the secret in words (the hub's E2E dispatch of 2026-09-25 failed to load on this).
  app-id:
    description: "GitHub App ID. The caller passes its KDF_APP_ID secret, a composite action reads no secret itself."
    required: true
  app-private-key:
    description: "GitHub App private key. The caller passes its KDF_APP_PRIVATE_KEY secret."
    required: true
  cicd-ref:
    description: "Ref of kriegerdataforge-cicd to run the engine from."
    required: false
    default: main
  gh-npm-token:
    description: >-
      Token for `npm ci` of the private @needless2say npm scope during frontend image
      builds (pass the caller's GH_NPM_TOKEN secret from journeys whose manifest repos
      include a frontend that consumes @needless2say/*). GH Packages npm accepts only
      classic PATs / GITHUB_TOKEN — the App token minted above does NOT work here.
      Optional: backend-only journeys need no npm token.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Free disk space for the image builds
      shell: bash
      run: |
        sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
          /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
        df -h /

    # The caller job has already checked ITSELF out into a path == its repo name
    # (sibling layout). Two manifests are read. The one on the caller's DEFAULT branch,
    # through the API with the job's own token, names the repositories the App token
    # may read, so a branch cannot widen the token's reach before the owner merges it.
    # The branch's own (the checkout) names the journey and the specs that run, and may
    # name only repositories the default branch's already does: a journey that needs a
    # new repository lands that manifest line first. This is what keeps the action
    # tenant-agnostic (no hardcoded list).
    - name: Resolve the journey and its repos from the caller's manifests
      id: resolve
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        JOURNEY_INPUT: ${{ inputs.journey }}
      run: |
        set -euo pipefail
        CALLER="${GITHUB_REPOSITORY##*/}"
        MF="${CALLER}/e2e/manifest.json"
        if [ ! -f "$MF" ]; then
          echo "::error::manifest not found at ${MF} — the caller job must check itself out into 'path: ${CALLER}'"
          exit 1
        fi
        JOURNEY=$(jq -r '.journey // empty' "$MF")
        if [ -z "$JOURNEY" ]; then
          echo "::error::${MF} names no journey"
          exit 1
        fi
        if [ -n "$JOURNEY_INPUT" ] && [ "$JOURNEY_INPUT" != "$JOURNEY" ]; then
          echo "::error::the journey input '${JOURNEY_INPUT}' is not this repo's manifest journey '${JOURNEY}' — a job runs its own repo's journey and no other"
          exit 1
        fi
        DEFAULT="${DEFAULT_BRANCH:-$(gh api "repos/${GITHUB_REPOSITORY}" --jq .default_branch)}"
        DEFAULT_MF="$(gh api "repos/${GITHUB_REPOSITORY}/contents/e2e/manifest.json?ref=${DEFAULT}" --jq .content | base64 -d)"
        mapfile -t DEFAULT_REPOS < <(printf '%s' "$DEFAULT_MF" | jq -r '.repos[]?')
        mapfile -t BRANCH_REPOS < <(jq -r '.repos[]?' "$MF")
        DEFAULT_LIST="$(printf '%s\n' "${DEFAULT_REPOS[@]}")"
        for repo in "${BRANCH_REPOS[@]}"; do
          # a here-string, not a pipe: grep -q closes early and pipefail would read that as a failure
          if ! grep -qx "$repo" <<< "$DEFAULT_LIST"; then
            echo "::error::${MF} names '${repo}', which the manifest on '${DEFAULT}' does not — merge that manifest line first, the App token's reach is decided by the default branch"
            exit 1
          fi
        done
        # Shared identity repos are ecosystem constants (one hub / auth-UI / SDK),
        # so they live in the action, not per-tenant config. hub + auth-UI are built
        # from source (checked out); the SDK is cloned during the image build via the
        # token (scope only, not a sibling checkout).
        SHARED_CHECKOUT=(kriegerdataforge kriegerdataforge-auth-ui)
        SDK=(kriegerdataforge-sdk)
        TOKEN_REPOS=$(printf '%s\n' "${SHARED_CHECKOUT[@]}" "${SDK[@]}" "${DEFAULT_REPOS[@]}" | awk 'NF' | sort -u)
        CLONE_REPOS=$(printf '%s\n' "${SHARED_CHECKOUT[@]}" "${BRANCH_REPOS[@]}" | awk 'NF' | sort -u | grep -vx "$CALLER" || true)
        {
          echo "caller=${CALLER}"
          echo "journey=${JOURNEY}"
          echo "token_repos<<EOF"; echo "${TOKEN_REPOS}"; echo "EOF"
          echo "clone_repos<<EOF"; echo "${CLONE_REPOS}"; echo "EOF"
        } >> "$GITHUB_OUTPUT"
        echo "Journey '${JOURNEY}' needs (checkout): ${CLONE_REPOS//$'\n'/, }, plus the caller ${CALLER} + cicd."

    - name: Mint GitHub App token (contents:read on just this journey's repos + SDK)
      id: app-token
      uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
      with:
        app-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.app-private-key }}
        owner: ${{ github.repository_owner }}
        repositories: ${{ steps.resolve.outputs.token_repos }}
        permission-contents: read

    - name: Checkout cicd (the engine) into the sibling layout
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        repository: ${{ github.repository_owner }}/kriegerdataforge-cicd
        ref: ${{ inputs.cicd-ref }}
        path: kriegerdataforge-cicd
        token: ${{ steps.app-token.outputs.token }}
        # The token serves this one checkout. Kept in .git/config it would ride into every
        # image build context and every later step of the job (auth UI register row 31).
        persist-credentials: false

    # One clone loop replaces the fixed per-repo checkout steps. The caller repo is
    # already present (checked out by the job); cicd was checked out above. Each sibling
    # comes at the caller's own branch name when it has one, so a change spanning two
    # repos is tested together before either merges, and at its default branch otherwise
    # (Phase C's first design question, the owner's answer of 2026-09-25).
    - name: Checkout the journey's sibling repos
      shell: bash
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token }}
        OWNER: ${{ github.repository_owner }}
        CLONE_REPOS: ${{ steps.resolve.outputs.clone_repos }}
        SIBLING_REF: ${{ inputs.sibling-ref }}
        CALLER_REF: ${{ github.head_ref || github.ref_name }}
      run: |
        set -euo pipefail
        REF="${SIBLING_REF:-$CALLER_REF}"
        while IFS= read -r repo; do
          [ -z "$repo" ] && continue
          if [ -d "$repo" ]; then echo "present, skipping: $repo"; continue; fi
          URL="https://x-access-token:${GH_TOKEN}@github.com/${OWNER}/${repo}.git"
          if git ls-remote --exit-code --heads "$URL" "refs/heads/${REF}" >/dev/null 2>&1; then
            echo "cloning $repo at its branch '${REF}'"
            git clone --depth 1 --branch "$REF" "$URL" "$repo"
          else
            echo "cloning $repo at its default branch (it has no branch '${REF}')"
            git clone --depth 1 "$URL" "$repo"
          fi
          # Strip the credentialed remote so the App token never persists in
          # <repo>/.git/config — a Docker `COPY . .` build context could otherwise
          # bake it into an image layer, regressing the BuildKit --mount=type=secret
          # hardening. The token is only needed for this one shallow clone.
          git -C "$repo" remote set-url origin "https://github.com/${OWNER}/${repo}.git"
        done <<< "${CLONE_REPOS}"

    # The hub records what it answers the auth UI (system_tests/contracts/auth_ui.json) and
    # the auth UI keeps the copy its suites run against (src/__contract__/hub.json). Until
    # now the two were compared on the owner's machine alone (auth UI register row 38).
    # Here every run holds them to each other, the shape auth UI D-021 and hub D-023 intend.
    - name: Hold the auth UI's copy of the hub contract to the hub's recording
      shell: bash
      run: |
        set -euo pipefail
        HUB=kriegerdataforge/system_tests/contracts/auth_ui.json
        COPY=kriegerdataforge-auth-ui/src/__contract__/hub.json
        if [ ! -f "$HUB" ] || [ ! -f "$COPY" ]; then
          echo "contract files not both present (${HUB}, ${COPY}), nothing to compare"
          exit 0
        fi
        if ! diff <(jq -S '{about, answers}' "$HUB") <(jq -S '{about, answers}' "$COPY") > contract.diff; then
          echo "::error::the auth UI's copy of the hub contract differs from the hub's recording — run 'make contract-sync' in kriegerdataforge-auth-ui against the hub checkout beside it, and land both"
          head -n 40 contract.diff
          exit 1
        fi
        echo "the two copies of the hub contract agree"

    - name: Set up Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        python-version: "3.14"

    - name: Install driver keygen dep
      shell: bash
      run: pip install cryptography

    - name: Set up Node
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
      with:
        node-version: "24"

    - name: Install Playwright (chromium)
      shell: bash
      working-directory: kriegerdataforge-cicd/e2e
      run: |
        npm ci
        npx playwright install --with-deps chromium

    - name: Build + up + migrate + seed the stack
      shell: bash
      working-directory: kriegerdataforge-cicd
      env:
        # CI headroom over the driver's local defaults (cold builds + compiles).
        E2E_BUILD_TIMEOUT: "2400"
        E2E_WAIT_TIMEOUT: "600"
        # The image build clones the private SDK; the App token is the git credential
        # (its scope includes kriegerdataforge-sdk). Auto-masked by Actions.
        GH_PACKAGES_PAT: ${{ steps.app-token.outputs.token }}
        # Frontend images `npm ci` the private @needless2say scope; classic-PAT-only
        # (GH Packages npm rejects App tokens), so it arrives as its own input.
        GH_NPM_TOKEN: ${{ inputs.gh-npm-token }}
        JOURNEY: ${{ steps.resolve.outputs.journey }}
      run: python e2e/ci_stack.py up --journey "$JOURNEY"

    - name: Run the journey
      shell: bash
      working-directory: kriegerdataforge-cicd/e2e
      # The login creds (E2E_USERNAME/PASSWORD) come from e2e/.env, which
      # `ci_stack.py up` writes from its own LOGIN_* constants — the same values the
      # hub seed registered, so there is a single source of truth (hardcoding them
      # here too would silently override .env, since loadEnvFile doesn't clobber a
      # set var, and could drift). playwright.config.ts loads e2e/.env. ci_stack.py
      # staged exactly the active journey's specs, so `npm test` runs precisely those.
      run: |
        npm test
        # Fail-closed gate (N2e): every spec test.skip()s when its login creds /
        # OIDC client env are unset. If manifest/driver drift left those unset,
        # `npm test` would skip everything and STILL exit 0 — a green-but-empty
        # gate that proves nothing. Refuse that: assert >=1 test actually ran
        # (jq is preinstalled on GitHub-hosted runners).
        report="test-results/results.json"
        if [ ! -f "$report" ]; then
          echo "::error::N2e: no Playwright results.json — cannot confirm any test ran"
          exit 1
        fi
        ran=$(jq '([.stats.expected // 0, .stats.unexpected // 0, .stats.flaky // 0] | add)' "$report")
        skipped=$(jq '.stats.skipped // 0' "$report")
        if [ "${ran:-0}" -eq 0 ]; then
          echo "::error::N2e: E2E gate executed 0 tests (skipped=${skipped}). Refusing a green-but-empty run — check the staged journeys' creds/client env."
          exit 1
        fi
        echo "N2e: ${ran} test(s) executed (skipped=${skipped})."

    - name: Dump compose logs on failure
      if: failure()
      shell: bash
      working-directory: kriegerdataforge-cicd
      run: python e2e/ci_stack.py logs

    - name: Upload Playwright report + traces
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: playwright-report-${{ steps.resolve.outputs.caller }}
        path: |
          kriegerdataforge-cicd/e2e/playwright-report/
          kriegerdataforge-cicd/e2e/test-results/
        # GOOD-6: on a FAILED backend/API journey the retained trace records the
        # confidential-client token exchange (Basic client_id:client_secret) and
        # the resulting Bearer access token. Those creds are per-run ephemeral —
        # the whole stack (and its OIDC client) is torn down at job end, so they
        # are dead the moment the run finishes. Keep the short debugging window
        # but minimise the exposure: 1-day retention instead of 7. Residual
        # (trace still holds the dead creds for that window) accepted as low.
        retention-days: 1
        if-no-files-found: ignore

    - name: Tear down the stack
      if: always()
      shell: bash
      working-directory: kriegerdataforge-cicd
      run: python e2e/ci_stack.py down
