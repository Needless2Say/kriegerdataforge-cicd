rules:
  - id: kdf-python-logger-secret-value
    languages: [python]
    severity: WARNING
    message: >-
      A value whose name says it holds a secret, a password, token, key, credential, cookie, authorization or code,
      or a headers object, is written to a log. Log what happened and whose it was, never the secret itself.
    metadata:
      category: security
      subcategory: [vuln]
      confidence: MEDIUM
      likelihood: MEDIUM
      impact: HIGH
      technology: [python]
      cwe:
        - "CWE-532: Insertion of Sensitive Information into Log File"
      owner: KDF, cicd D-085, it replaces the stock python-logger-credential-disclosure, which read a log line's words
    patterns:
      - pattern-either:
          - pattern: $LOG.$METHOD(..., $VALUE, ...)
          - pattern: $LOG.$METHOD(..., f"...{$VALUE}...", ...)
          - pattern: $LOG.$METHOD(..., $TEXT.format(..., $VALUE, ...), ...)
          - pattern: $LOG.$METHOD(..., extra={..., $KEY: $VALUE, ...}, ...)
      - metavariable-regex:
          metavariable: $LOG
          regex: (?i)^(?:[a-z_][a-z0-9_]*\.)*_*(?:log|logger|logging)$
      - metavariable-regex:
          metavariable: $METHOD
          regex: ^(?:debug|info|warning|warn|error|exception|critical|fatal|log)$
      # the logged value is a plain name or a dotted one, never a string or a call, and its last part holds one of
      # the words as a whole part between underscores, a status, exit or other code of that kind left out. Extended
      # mode, so the folded lines' spaces mean nothing
      - metavariable-regex:
          metavariable: $VALUE
          regex: >-
            (?ix)^(?:[a-z_][a-z0-9_]*\.)*
            (?!(?:[a-z0-9]+_)*(?:status|exit|return|error|http|response|country|zip|postal|currency|language|lang)_codes?$)
            _*(?:[a-z0-9]+_)*(?:password|passwd|pwd|secret|token|key|credential|cookie|authorization|code|header)s?
            (?:_[a-z0-9]+)*$
