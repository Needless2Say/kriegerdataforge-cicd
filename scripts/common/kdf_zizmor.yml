# The local code scan's zizmor configuration, carried in the scan's bundle (D-085). The wrapper runs zizmor with
# --no-ignores, so these settings and the wrapper's own check of each marker are the only ways a finding is set aside.
rules:
  # every action stays pinned by its commit's hash. The wrapper itself accepts a call of cicd's own reusable workflows
  # at the ref main and at no other, which a ref-pin policy here could not tell from any branch or tag of cicd
  unpinned-uses:
    config:
      policies:
        "*": hash-pin
  # callers pass every secret they hold to cicd's reusable workflows, pending a later change that names each secret
  # per call, a design of its own
  secrets-inherit:
    disable: true
  # every ecosystem but cicd's own GitHub Actions sets open-pull-requests-limit 0, so Dependabot opens no version update
  # a cooldown could hold, and cicd's own ecosystem gains a cooldown in its adoption
  dependabot-cooldown:
    disable: true
